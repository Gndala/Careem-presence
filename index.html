<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1438">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحضور والغياب">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>نظام الحضور والغياب — ثانوية نهج البلاغة الأهلية للبنين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--g1:#f6d56a;--g2:#d9a521;--g3:#a87a12;--navy:#0a1438;--navy2:#13245f;--ink:#f5f1e3;--mut:#a3acd2;--red:#ff5a6a;--amb:#ffb43a;--grn:#2ee6a0;--card:rgba(255,255,255,.06);--bd:rgba(246,213,106,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:#060b22;color:var(--ink);min-height:100vh;padding-bottom:92px;direction:rtl;font-size:15px;line-height:1.6}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 520px at 90% -10%,#2447c455,transparent 60%),radial-gradient(700px 500px at -10% 35%,#d9a52124,transparent 60%),linear-gradient(180deg,#0a1438,#060b22)}
.orb{position:fixed;border-radius:50%;filter:blur(70px);z-index:-1;opacity:.28;pointer-events:none;animation:fl 16s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:#f6d56a;top:20%;left:-120px}.o2{width:340px;height:340px;background:#2a4bd6;bottom:5%;right:-140px;animation-delay:-6s}
@keyframes fl{to{transform:translate(40px,-60px) scale(1.15)}}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{to{background-position:200% 0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:760px;margin:auto;padding:14px}
.gt{background:linear-gradient(100deg,var(--g1),#fff6c9 40%,var(--g2) 70%,var(--g1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
/* hero */
.hero{text-align:center;padding:22px 10px 8px}
.logo{width:132px;height:132px;border-radius:34px;background:#fbf8ef;object-fit:contain;padding:6px;box-shadow:0 0 0 2px var(--g2),0 0 44px #f6d56a55,0 18px 40px #0009;animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
.hero h1{margin:14px 0 0;font-size:26px;font-weight:900;line-height:1.35}
.hero .en{color:var(--g1);letter-spacing:1.5px;font-weight:600;font-size:13px;opacity:.85}
.hero .dt{margin-top:8px;color:var(--mut);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px 6px;text-align:center;backdrop-filter:blur(10px)}
.tile b{display:block;font-size:26px;font-weight:900;color:var(--g1);line-height:1.2}.tile span{font-size:12px;color:var(--mut)}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px;margin:12px 0;backdrop-filter:blur(10px)}
.card h3{margin:0 0 10px;font-size:17px;font-weight:800;color:var(--g1)}
.cls{position:relative;overflow:hidden}
.cls:before{content:"";position:absolute;top:0;bottom:0;right:0;width:5px;background:linear-gradient(var(--g1),var(--g3))}
.cls .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-right:6px}
.cls .h b{font-size:18px;font-weight:800}.cls .h small{color:var(--mut)}
.secs{display:flex;flex-wrap:wrap;gap:8px}
.sec{flex:1 1 90px;background:linear-gradient(160deg,#1b2f78,#111d4d);border:1px solid var(--bd);border-radius:16px;padding:10px;text-align:center;cursor:pointer;transition:.2s}
.sec:active{transform:scale(.96)}.sec:hover{border-color:var(--g1)}
.sec b{display:block;font-size:20px;color:var(--g1);font-weight:900}.sec small{color:var(--mut);font-size:12px}
/* buttons */
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.1);transition:.15s}
.btn:active{transform:scale(.97)}
.gold{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));color:#2a1c00;box-shadow:0 8px 22px #d9a52144}
.red{background:linear-gradient(135deg,#ff7b88,#e0384c);color:#fff}
.blue{background:linear-gradient(135deg,#4d7bff,#2447c4);color:#fff}
.full{width:100%}.sm{padding:8px 12px;border-radius:12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1 1 130px}
/* forms */
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:11px 13px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--g1);box-shadow:0 0 0 3px #f6d56a22}
select option{color:#000}
input[type=date]{color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* top bar */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 8px}
.top h2{margin:0;font-size:19px;font-weight:800}.top small{color:var(--mut)}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-size:20px;cursor:pointer;flex:none}
.tabs{display:flex;background:rgba(255,255,255,.07);border-radius:16px;padding:4px;margin:10px 0}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:12px;font-weight:700;cursor:pointer;color:var(--mut)}
.tabs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#2a1c00}
/* lessons */
.ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.l{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:16px;padding:9px 4px;text-align:center;cursor:pointer;position:relative;transition:.15s}
.l b{display:block;font-size:15px}.l small{font-size:11px;color:var(--mut);display:block;direction:ltr}
.l.on{border-color:var(--g1);background:linear-gradient(160deg,#27428f,#16286b);box-shadow:0 0 0 3px #f6d56a2a}
.l.done:after{content:"✓";position:absolute;top:4px;left:7px;color:var(--grn);font-weight:900}
/* attendance */
.sticky{position:sticky;top:0;z-index:20;background:linear-gradient(#0a1438f2,#0a1438e0);backdrop-filter:blur(14px);margin:-14px -14px 10px;padding:12px 14px 10px;border-bottom:1px solid var(--bd)}
.pills{display:flex;gap:8px;margin-top:8px}
.pill{flex:1;text-align:center;border-radius:14px;padding:5px;font-weight:800;font-size:13px}
.pill b{font-size:18px;display:block;line-height:1.1}
.p-ok{background:#2ee6a01f;color:var(--grn)}.p-ab{background:#ff5a6a22;color:var(--red)}.p-ex{background:#ffb43a22;color:var(--amb)}
.row{background:var(--card);border:1.5px solid rgba(255,255,255,.1);border-radius:20px;padding:10px;margin:9px 0;transition:.15s}
.row.a{background:#ff5a6a1c;border-color:#ff5a6a88}.row.e{background:#ffb43a1c;border-color:#ffb43a88}
.row .t{display:flex;align-items:center;gap:10px}
.num{width:28px;text-align:center;color:var(--mut);font-weight:800;font-size:13px;flex:none}
.av{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--navy2),#26408f);border:1.5px solid var(--bd);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:900;color:var(--g1);font-size:18px}
.av img{width:100%;height:100%;object-fit:cover}
.nm{flex:1;min-width:0}.nm b{display:block;font-weight:700;line-height:1.35}.nm small{color:var(--mut);font-size:12px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr 46px 46px;gap:8px;margin-top:9px}
.acts button{border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);padding:10px 0;font-weight:800;cursor:pointer;position:relative}
.acts .bA.on{background:linear-gradient(135deg,#ff7b88,#e0384c);border-color:transparent;color:#fff}
.acts .bE.on{background:linear-gradient(135deg,#ffcf6b,#f0952a);border-color:transparent;color:#2a1700}
.acts .bB i{position:absolute;top:-6px;left:-4px;background:var(--g1);color:#2a1c00;border-radius:10px;font-size:11px;font-style:normal;min-width:19px;padding:0 4px;font-weight:900}
.acts .bB.has{border-color:var(--g1);color:var(--g1)}
.acts .bW{opacity:.55}.acts .bW.on{opacity:1;background:linear-gradient(135deg,#25d366,#128c7e);border-color:transparent;color:#fff}
.savebar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#060b22 35%)}
.savebar .btn{max-width:732px;display:block;margin:auto}
/* student rows */
.sr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:10px;margin:8px 0;cursor:pointer}
.sr .bd{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.b{font-size:11px;font-weight:800;border-radius:10px;padding:1px 8px}
.b.r{background:#ff5a6a26;color:var(--red)}.b.a{background:#ffb43a26;color:var(--amb)}.b.g{background:#2ee6a024;color:var(--grn)}.b.y{background:#f6d56a22;color:var(--g1)}
/* profile */
.prof{display:flex;gap:14px;align-items:center}
.prof .ph{width:104px;height:124px;border-radius:22px;overflow:hidden;border:2px solid var(--g2);background:linear-gradient(135deg,var(--navy2),#26408f);display:grid;place-items:center;flex:none;font-size:40px;font-weight:900;color:var(--g1);box-shadow:0 0 30px #f6d56a33}
.prof .ph img{width:100%;height:100%;object-fit:cover}
.prof h2{margin:0 0 4px;font-size:20px}.prof p{margin:0;color:var(--mut);font-size:13px}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.k{border-radius:18px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.1)}
.k b{display:block;font-size:30px;font-weight:900;line-height:1.1}.k span{font-size:12px;color:var(--mut)}
.k.r{background:#ff5a6a18}.k.r b{color:var(--red)}.k.a{background:#ffb43a18}.k.a b{color:var(--amb)}.k.g{background:#2ee6a016}.k.g b{color:var(--grn)}.k.y{background:#f6d56a14}.k.y b{color:var(--g1)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--g1);text-align:right;padding:6px 4px;border-bottom:1px solid var(--bd)}
table.t td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:30px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);font-weight:700;cursor:pointer;font-size:14px}
.chip.neg.on{background:#ff5a6a;border-color:#ff5a6a;color:#fff}.chip.pos.on{background:var(--grn);border-color:var(--grn);color:#02281b}
.chip b{margin-right:8px;color:var(--red);cursor:pointer}
/* nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#080f2ce6;backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
#nav button{flex:1;max-width:200px;border:0;background:none;color:var(--mut);padding:6px;border-radius:14px;font-weight:700;cursor:pointer;font-size:12px}
#nav button span{display:block;font-size:20px}#nav button.on{color:var(--g1);background:#f6d56a14}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:26px 0 8px}.foot b{color:var(--g1)}
/* modal */
#modal{position:fixed;inset:0;z-index:60;background:#02061acc;backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#14246a,#0a1438);border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 6px;font-size:19px}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:28px}}
.pin{text-align:center;font-size:26px;letter-spacing:10px}
.shake{animation:shake .35s}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);z-index:99;background:#fff;color:#0a1438;padding:11px 20px;border-radius:30px;font-weight:800;box-shadow:0 10px 30px #0007;transition:.3s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.camwrap{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
.camwrap video{flex:1;width:100%;object-fit:cover;min-height:0}
.camtools{display:flex;justify-content:space-around;align-items:center;padding:18px;background:#000}
.camtools button{background:#ffffff22;border:0;color:#fff;border-radius:14px;padding:12px 18px;font-weight:700}
.camtools .shutter{width:70px;height:70px;border-radius:50%;background:#fff;border:5px solid #ffffff88}
.edph{width:110px;height:130px;margin:6px auto;border-radius:22px;overflow:hidden;border:2px solid var(--g2);background:#0a1438;display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center}
.edph img{width:100%;height:100%;object-fit:cover}
details.card summary{cursor:pointer;font-weight:800;color:var(--g1);font-size:16px;list-style:none}
details.card[open] summary{margin-bottom:10px}
.lt{display:flex;gap:8px;align-items:center;margin:6px 0}.lt span{width:80px;font-weight:700;flex:none}
#syncb{position:fixed;top:6px;left:8px;z-index:40;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;background:#0a1438cc;border:1px solid var(--bd);color:var(--mut);pointer-events:none}#syncb.ok{color:var(--grn)}#syncb.w{color:var(--amb)}#syncb.e{color:var(--red)}
/* ================= PRINT PAPER ================= */
#printArea{display:none}
@page{size:A4;margin:8mm}
@media print{
 html,body{background:#fff!important;padding:0!important;color:#000}
 body:before,.orb{display:none!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.pp-head{display:flex;align-items:center;gap:12px;border-bottom:3px double #b8892b;padding-bottom:8px;position:relative}
.pp-head img{width:80px;height:80px;object-fit:contain}
.pp-t{flex:1;text-align:center}.pp-t .a{font-size:22px;font-weight:900}.pp-t .e{font-size:12px;letter-spacing:.8px;color:#8a6417;font-weight:700}.pp-t .rg{font-size:11px;color:#556}
.pp-no{width:80px;text-align:center;font-size:11px;color:#556}.pp-no b{display:block;color:#b8892b;font-size:15px}
.pp-title{text-align:center;margin:12px 0;position:relative}
.pp-title span{display:inline-block;padding:5px 40px;background:linear-gradient(90deg,#0b1a4a,#1b3a9a);color:#f6d56a;font-weight:900;font-size:19px;border-radius:30px}
.pp-info{display:flex;gap:14px;align-items:stretch;margin-bottom:10px;position:relative}
.pp-info .ph{width:104px;height:128px;border:2px solid #b8892b;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#aaa;font-size:11px;flex:none;background:#faf6e8}
.pp-info .ph img{width:100%;height:100%;object-fit:cover}
.pp-info table{flex:1;border-collapse:collapse}
.pp-info td{border:1px solid #d8c796;padding:4px 9px}.pp-info td:nth-child(odd){background:#f7f0d9;font-weight:800;width:17%;white-space:nowrap}
.pp h4{margin:12px 0 5px;font-size:14px;color:#0b1a4a;border-right:5px solid #b8892b;padding-right:8px;position:relative}
.pp-k{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:relative}
.pp-k div{border:1.5px solid #d8c796;border-radius:10px;text-align:center;padding:5px 2px;background:#fffdf5}
.pp-k b{display:block;font-size:22px;line-height:1.2;color:#0b1a4a}.pp-k span{font-size:11px;color:#556}
.pp-k .r b{color:#c0283a}.pp-k .a b{color:#c27a00}.pp-k .g b{color:#0f8a5f}
table.pp-t2{width:100%;border-collapse:collapse;position:relative;font-size:12px}
table.pp-t2 th{background:#0b1a4a;color:#f6d56a;padding:4px 6px;border:1px solid #0b1a4a}
table.pp-t2 td{border:1px solid #d8c796;padding:3px 6px;text-align:center}
table.pp-t2 tr:nth-child(even) td{background:#fbf7e8}
.pp-sig{display:flex;justify-content:space-around;margin-top:26px;text-align:center;position:relative}
.pp-sig div{width:30%;border-top:1.5px dashed #0b1a4a;padding-top:4px;font-weight:700}
.pp-foot{margin-top:14px;border-top:3px double #b8892b;padding-top:6px;display:flex;justify-content:space-between;font-size:11px;color:#556;position:relative}
.pp-foot b{color:#8a6417}
.pp-box{border:2px solid #b8892b;border-radius:14px;padding:10px 14px;margin:10px 0;background:#fffdf5;position:relative;font-size:14px;line-height:2}
.pp-warn{border-color:#a3202f;outline-color:#a3202f}
.pp-warn .pp-title span{background:linear-gradient(90deg,#7e1220,#c0283a);font-size:26px;padding:4px 56px}
.pp-warn .pp-head,.pp-warn .pp-foot{border-color:#a3202f}
.pp-warn h4{border-color:#a3202f}
.pp-tear{border-top:2px dashed #666;margin-top:18px;padding-top:10px;position:relative}
.pp-tear:before{content:"✂";position:absolute;top:-13px;right:14px;background:#fff;padding:0 6px;font-size:16px}
.pp-line{display:inline-block;min-width:130px;border-bottom:1.5px dotted #0b1a4a;text-align:center;font-weight:800}

.pp-land{overflow:visible;padding:10px 14px}
.pp-land .pp-head img{width:56px;height:56px}
.pp-land .pp-title{margin:6px 0}.pp-land .pp-title span{font-size:16px;padding:3px 30px}
.pp-meta{position:relative;font-weight:700;font-size:12px;margin:2px 0 6px}
table.pp-g{width:100%;border-collapse:collapse;table-layout:fixed;position:relative;font-size:10px}
table.pp-g th,table.pp-g td{border:1px solid #c9b77f;text-align:center;padding:1px 0;line-height:1.35}
table.pp-g th{background:#0b1a4a;color:#f6d56a;font-weight:700}
table.pp-g thead{display:table-header-group}table.pp-g tr{page-break-inside:avoid}
table.pp-g .gn{width:6mm}table.pp-g .gname{width:44mm;text-align:right;padding:1px 4px;white-space:nowrap;overflow:hidden}
table.pp-g th.gd{font-size:10px}table.pp-g th.gd small{font-size:8px;font-weight:400}
table.pp-g th.gl{background:#1b3a9a;color:#fff;font-size:9px}
table.pp-g th.gs{background:#f7f0d9;color:#0b1a4a;height:19mm;padding:0;vertical-align:bottom}
table.pp-g th.gs span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:8px;font-weight:600;display:inline-block;max-height:18mm;overflow:hidden;white-space:nowrap}
table.pp-g td.gp{color:#0f8a5f;font-weight:800}
table.pp-g td.ga{background:#fde0e3;color:#c0283a;font-weight:900}
table.pp-g td.ge{background:#fff1d6;color:#c27a00;font-weight:900}
table.pp-g td.gx{color:#bbb}
table.pp-g tbody tr:nth-child(even) td.gname,table.pp-g tbody tr:nth-child(even) td:first-child{background:#fbf7e8}
table.pp-s{width:100%;border-collapse:collapse;position:relative;font-size:12px}
table.pp-s th{background:#0b1a4a;color:#f6d56a;padding:3px 6px;border:1px solid #0b1a4a}
table.pp-s td{border:1px solid #d8c796;padding:2px 6px;text-align:center}
table.pp-s td.gname{text-align:right}
table.pp-s tr{page-break-inside:avoid}table.pp-s thead{display:table-header-group}

.row.l{background:#4aa3ff1c;border-color:#4aa3ff88}
.acts .bL.on{background:linear-gradient(135deg,#6ab8ff,#2f7de1);border-color:transparent;color:#fff}
.p-lt{background:#4aa3ff22;color:#6ab8ff}
.bar{height:10px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7b88,#e0384c);border-radius:8px}
.trend{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:6px}
.trend>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:0}
.trend i{width:100%;background:linear-gradient(180deg,#ff7b88,#e0384c);border-radius:6px 6px 2px 2px}
.trend small{font-size:10px;color:var(--mut)}
table.pp-g td.gt{background:#dcecff;color:#1c62c4;font-weight:900}

.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.dchip{flex:0 0 64px;border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:6px 4px;text-align:center;cursor:pointer;background:rgba(255,255,255,.05)}
.dchip.on{background:linear-gradient(135deg,#f6d56a,#d9ae2c);color:#0a1438;border-color:transparent}
.dchip b{display:block;font-size:14px}.dchip small{display:block;font-size:10px;opacity:.8}
.dchip i{display:inline-block;margin-top:3px;font-style:normal;font-size:11px;font-weight:800;color:#ff7b88;background:rgba(255,80,100,.15);border-radius:8px;padding:0 7px}
.dchip.on i{color:#8a1226;background:rgba(255,255,255,.6)}
.tw{overflow:auto;max-height:70vh;border-radius:10px;-webkit-overflow-scrolling:touch}
table.tb{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
table.tb th,table.tb td{border-left:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);padding:4px 6px;text-align:center;white-space:nowrap}

table.tb .nm{position:sticky;right:0;background:#0e1a44;text-align:right;min-width:120px;max-width:150px;overflow:hidden;text-overflow:ellipsis;z-index:1;font-weight:700}
table.tb thead .nm{z-index:3;background:#16255a}
table.tb td.ga{background:#ff506433;color:#ff7b88;font-weight:900}
table.tb td.ge{background:#ffb02a2e;color:#ffbf4d;font-weight:900}
table.tb td.gt2{background:#4aa3ff2e;color:#6ab8ff;font-weight:900}

let db=null,mem={};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('nahj_att',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej(e)}})}
async function idbGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return mem[k]||null}}
async function idbPut(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){mem[k]=v}}

async function sha(v){try{if(!(window.crypto&&crypto.subtle))return null;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('nahj|'+v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return null}}
const isHash=c=>/^[0-9a-f]{64}$/.test(c||'');
const LV={teacher:1,asst:2,admin:3},RN={teacher:'مدرس',asst:'معاون',admin:'مدير'};
let cur=null;
const lvl=()=>isAdmin()&&cur?LV[cur.r]:0;
async function pinOk(v){
 const h=await sha(v);
 for(const u of db.users||[]){if(h&&u.h===h)return{n:u.n,r:u.r,id:u.id}}
 const main={n:'المدير',r:'admin',id:'main'};
 if(isHash(db.code))return h===db.code?main:null;
 if(v!==db.code)return null;
 if(h){db.code=h;save()}
 return main}

  const L=byD[d].sort((a,b)=>a.lesson-b.lesson);r.days++;
  const a=L.filter(x=>x.marks[s.id]==='a').length,e=L.filter(x=>x.marks[s.id]==='e').length;
  if(a===L.length&&L.length>=fd)r.fullAbs++;else if(e===L.length&&L.length>=fd)r.fullExc++;else{r.partAbs+=a;r.partExc+=e}
  r.absL+=a;r.excL+=e;r.lateL+=L.filter(x=>x.marks[s.id]==='l').length;
  L.forEach(x=>{
   const m=x.marks[s.id];if(m)r.log.push({date:d,lesson:x.lesson,subject:x.subject,teacher:x.teacher,st:m});
   const b=(x.beh&&x.beh[s.id])||[],nt=(x.notes&&x.notes[s.id])||'';
   if(b.length||nt){r.behLog.push({date:d,lesson:x.lesson,subject:x.subject,teacher:x.teacher,tags:b,note:nt});
    b.forEach(t=>{r.beh[t]=(r.beh[t]||0)+1;const bo=db.behaviors.find(z=>z.n===t);if(bo){if(bo.k==='pos')r.pos++;else r.neg++}})}
  });
 });
 return r;
}

/* ---------- PHOTO ---------- */
function cropTo(src,w,h,size=280){const c=document.createElement('canvas');c.width=c.height=size;const s=Math.min(w,h);c.getContext('2d').drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,size,size);return c.toDataURL('image/jpeg',.72)}
function pickPhoto(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>cb(cropTo(im,im.width,im.height));im.src=URL.createObjectURL(f)};i.click()}
async function capturePhoto(cb){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('الكاميرا غير متاحة هنا — اخترنا لك رفع صورة');return pickPhoto(cb)}
 const w=document.createElement('div');w.className='camwrap';w.innerHTML='<video playsinline autoplay muted></video><div class="camtools"><button id="cx">إغلاق</button><button class="shutter" id="cs" aria-label="التقاط"></button><button id="cf">قلب الكاميرا</button></div>';
 document.body.appendChild(w);let stream,facing='user';const v=w.querySelector('video');
 const stop=()=>{stream&&stream.getTracks().forEach(t=>t.stop());w.remove()};
 const start=async()=>{stream&&stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:1280}},audio:false});v.srcObject=stream}catch(e){stop();toast('تعذّر فتح الكاميرا — تأكد من السماح بالوصول');}};
 $('#cx').onclick=stop;$('#cf').onclick=()=>{facing=facing==='user'?'environment':'user';start()};
 $('#cs').onclick=()=>{if(!v.videoWidth)return;const d=cropTo(v,v.videoWidth,v.videoHeight);stop();cb(d)};
 start();
}

/* ---------- STUDENT EDIT ---------- */
let tmpPhoto='';
function editStudent(id,cls,sec){askAdmin(()=>{
 const s=id?db.students.find(x=>x.id===id):{name:'',reg:'',page:'',cls:cls||'',sec:sec||'',photo:''};tmpPhoto=s.photo||'';
 openModal(`<h3>${id?'تعديل بيانات الطالب':'إضافة طالب جديد'}</h3>
 <div class="edph" id="edph">${tmpPhoto?`<img src="${tmpPhoto}">`:'لا توجد صورة'}</div>
 <div class="btns"><button class="btn sm" onclick="capturePhoto(d=>setPh(d))">📷 التقاط صورة</button><button class="btn sm" onclick="pickPhoto(d=>setPh(d))">🖼 رفع صورة</button>${tmpPhoto?'<button class="btn sm" onclick="setPh(\'\')">إزالة</button>':''}</div>
 <label>الاسم الكامل</label><input id="eN" value="${esc(s.name)}">
 <div class="two"><div><label>رقم القيد</label><input id="eR" value="${esc(s.reg)}" inputmode="numeric"></div><div><label>الصفحة</label><input id="eP" value="${esc(s.page)}" inputmode="numeric"></div></div>
 <div class="two"><div><label>الصف</label><input id="eC" list="dc" value="${esc(s.cls)}"></div><div><label>الشعبة</label><input id="eS" list="ds" value="${esc(s.sec)}"></div></div>
 <datalist id="dc">${Object.keys(db.structure).map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="ds">${[...new Set(Object.values(db.structure).flat())].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <div class="btns" style="margin-top:16px"><button class="btn gold" onclick="saveStudent(${id?`'${id}'`:'null'})">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);
},2)}
function setPh(d){tmpPhoto=d;$('#edph').innerHTML=d?`<img src="${d}">`:'لا توجد صورة'}
function saveStudent(id){
 const name=$('#eN').value.trim(),cls=$('#eC').value.trim(),sec=$('#eS').value.trim();
 if(!name||!cls||!sec){toast('الاسم والصف والشعبة مطلوبة');return}
 if(/[|\/]/.test(cls+sec)){toast('لا تستخدم الرمزين | أو / في الصف والشعبة');return}
 const o={name,reg:$('#eR').value.trim(),page:$('#eP').value.trim(),cls,sec,photo:tmpPhoto};
 if(id){const st=db.students.find(x=>x.id===id),oc=st.cls,os=st.sec;Object.assign(st,o);if(oc!==cls||os!==sec){st.cls=oc;st.sec=os;recMove(st,cls,sec,todayStr());logA('نقل طالب',`${name}: ${oc} / ${os} ← ${cls} / ${sec}`)}}else db.students.push({id:uid(),...o});
 logA(id?'تعديل بيانات طالب':'إضافة طالب',`${name} — ${cls} / ${sec}`);ensureStruct(cls,sec);save();closeModal();toast('تم الحفظ ✓');render();
}
function delStudent(id){askAdmin(()=>confirmBox('سيُنقل الطالب إلى سلة المحذوفات (في الإدارة) ويمكن استرجاعه خلال 60 يوماً. المتابعة؟',()=>{snapshot();const ds=db.students.find(s=>s.id===id);if(ds){db.trash=db.trash||[];db.trash.unshift({id:uid(),t:Date.now(),u:cur&&isAdmin()?cur.n:'',s:JSON.parse(JSON.stringify(ds))});db.trash.length=Math.min(db.trash.length,100)}logA('حذف طالب',ds?`${ds.name} — ${ds.cls} / ${ds.sec}`:'');db.students=db.students.filter(s=>s.id!==id);save();toast('تم الحذف');history.back()},'حذف'))}

/* ---------- PRINT DOCS ---------- */
function infoBlock(s){return `<div class="pp-info"><div class="ph">${s.photo?`<img src="${s.photo}">`:'الصورة'}</div><table><tr><td>اسم الطالب</td><td colspan="3"><b>${esc(s.name)}</b></td></tr><tr><td>الصف</td><td>${esc(s.cls)}</td><td>الشعبة</td><td>${esc(s.sec)}</td></tr><tr><td>رقم القيد</td><td>${esc(s.reg||'—')}</td><td>الصفحة</td><td>${esc(s.page||'—')}</td></tr></table></div>`}
function pHead(num){return `<div class="pp-head"><img src="${LOGO}"><div class="pp-t"><div class="rg">جمهورية العراق — وزارة التربية</div><div class="a">${SCHOOL}</div><div class="e">${SCHOOL_EN}</div></div><div class="pp-no">${num?`رقم الوصل<b>${num}</b>`:''}التاريخ<br>${fmtD(todayStr())}</div></div>`}
const pFoot=()=>`<div class="pp-foot" style="justify-content:center"><span>${SCHOOL}</span></div>`;
function docDialog(id,kind){
 const s=db.students.find(x=>x.id===id);
 if(kind==='report'){return printDoc(reportHTML(s))}
 const x=stats(s),isW=kind==='warn';
 openModal(`<h3>${isW?'وصل إنذار':'وصل تعهد'}</h3><div style="color:var(--mut)">${esc(s.name)}</div>
 ${isW?`<label>درجة الإنذار</label><select id="dLv"><option>إنذار أول</option><option>إنذار ثانٍ</option><option>إنذار ثالث</option><option>إنذار نهائي</option></select>`:''}
 <label>${isW?'سبب الإنذار':'موضوع التعهد'}</label><select id="dRs"><option>كثرة الغياب عن الدوام</option><option>التأخر المتكرر</option><option>سلوك غير منضبط</option><option>الإخلال بنظام الدرس</option><option>أخرى (اكتبها أدناه)</option></select>
 <label>تفاصيل / ملاحظات إضافية (اختياري)</label><textarea id="dNt" rows="2"></textarea>
 ${isW?'':`<div class="two"><div><label>اسم ولي الأمر</label><input id="dGn"></div><div><label>رقم الهاتف</label><input id="dGp" inputmode="tel"></div></div><label>صلة القرابة</label><input id="dGr" placeholder="الأب / الأخ / ...">`}
 <div class="btns" style="margin-top:14px"><button class="btn gold" onclick="doPrint('${id}','${kind}')">🖨 طباعة / حفظ PDF</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);
 if(!x.fullAbs&&!x.absL&&x.neg)$('#dRs').selectedIndex=2;

async function doPrint(id,kind){
 const s=db.students.find(x=>x.id===id),o={lv:$('#dLv')?.value||'',rs:$('#dRs').value,nt:$('#dNt').value.trim(),gn:$('#dGn')?.value.trim()||'',gp:$('#dGp')?.value.trim()||'',gr:$('#dGr')?.value.trim()||''};
 closeModal();const cn=await nextNum();const num=new Date().getFullYear()+'/'+cn;
 logA(kind==='warn'?'إصدار وصل إنذار':'إصدار وصل تعهد',`${s.name} — ${o.lv||''} ${o.rs}`.trim());printDoc(kind==='warn'?warnHTML(s,o,num):pledgeHTML(s,o,num));
}
function printDoc(h,land){
 let st=document.getElementById('pgsz');if(!st){st=document.createElement('style');st.id='pgsz';document.head.appendChild(st)}
 st.textContent=land?'@page{size:A4 landscape;margin:8mm}':'@page{size:A4;margin:8mm}';
 $('#printArea').innerHTML=h;setTimeout(()=>window.print(),400)}
function reportHTML(s){
 const x=stats(s);

 return `<div class="pp">${pHead('')}<div class="pp-title"><span>تقرير الطالب التفصيلي</span></div>${infoBlock(s)}

 <div class="pp-k" style="margin-top:7px"><div><b>${x.days}</b><span>أيام مسجّلة</span></div><div class="r"><b>${x.neg}</b><span>ملاحظات سلوكية سلبية</span></div><div class="g"><b>${x.pos}</b><span>ملاحظات إيجابية</span></div><div><b>${x.fullExc}</b><span>أيام مجازة كاملة</span></div></div>${x.lateL?`<div class="pp-k" style="margin-top:7px"><div><b>${x.lateL}</b><span>مرات التأخر عن الدرس</span></div></div>`:''}
 <h4>السلوك</h4><div style="position:relative">${tags||'لا توجد سلوكيات مسجّلة.'}</div>
 ${x.behLog.length?`<table class="pp-t2" style="margin-top:6px"><tr><th>التاريخ</th><th>الدرس</th><th>المادة</th><th>المدرس</th><th>السلوك / الملاحظة</th></tr>${x.behLog.map(r=>`<tr><td>${fmtD(r.date)}</td><td>${r.lesson}</td><td>${esc(r.subject)}</td><td>${esc(r.teacher)}</td><td style="text-align:right">${esc(r.tags.join(' ، '))}${r.note?' — '+esc(r.note):''}</td></tr>`).join('')}</table>`:''}

/* ---------- WHATSAPP ---------- */
function setWa(c,v){
 v=v.trim();db.wa=db.wa||{};
 if(!v){delete db.wa[c];save();toast('تم إلغاء ربط '+c);return}
 if(!/^https:\/\/chat\.whatsapp\.com\/\S+$/i.test(v)){toast('الرابط غير صالح — يجب أن يبدأ بـ https://chat.whatsapp.com/');return}
 db.wa[c]=v;save();toast('تم ربط مجموعة '+c+' ✓');
}
function waText(x){
 const list=studentsOf(x.cls,x.sec,x.date),ab=list.filter(s=>x.marks[s.id]==='a'),ex=list.filter(s=>x.marks[s.id]==='e'),lt=list.filter(s=>x.marks[s.id]==='l');
 let t=`*${SCHOOL}*\n📋 كشف الغياب\n${x.cls} — شعبة ${x.sec}\n📅 ${fmtD(x.date,true)}\n${lessonName(x.lesson)} • ${x.subject} • الأستاذ ${x.teacher}\n`;
 t+=ab.length?`\n❌ الغائبون (${ab.length}):\n`+ab.map((s,i)=>`${i+1}. ${s.name}`).join('\n'):'\n✅ لا يوجد غائبون';
 if(ex.length)t+=`\n\n🟡 المجازون (${ex.length}):\n`+ex.map((s,i)=>`${i+1}. ${s.name}`).join('\n');
 if(lt.length)t+=`\n\n🔵 المتأخرون (${lt.length}):\n`+lt.map((s,i)=>`${i+1}. ${s.name}`).join('\n');
 return t+`\n\nالحاضرون: ${list.length-ab.length-ex.length} من ${list.length}`;
}
function waPrompt(id){
 const x=db.sessions.find(z=>z.id===id);if(!x){toast('لا يوجد تسجيل لهذا الدرس');return}
 const link=(db.wa||{})[x.cls];
 openModal(`<h3>📲 إرسال الغياب إلى واتساب</h3><div style="color:var(--mut);font-size:13px">يمكنك تعديل النص قبل الإرسال.</div>
 <textarea id="waT" rows="9" style="margin-top:10px">${esc(waText(x))}</textarea>
 <div class="btns" style="margin-top:12px"><button class="btn gold" onclick="waSend()">إرسال عبر واتساب</button>${link?`<button class="btn blue" onclick="waGroup(${J(link)})">نسخ وفتح مجموعة ${esc(x.cls)}</button>`:''}</div>
 <div class="btns" style="margin-top:8px"><button class="btn sm" onclick="waCopy()">نسخ النص</button><button class="btn sm" onclick="closeModal()">إغلاق</button></div>
 <small style="color:var(--mut);display:block;margin-top:8px">${link?'زر "إرسال عبر واتساب" يفتح واتساب لتختار المجموعة. زر "نسخ وفتح" يفتح مجموعة الصف مباشرة، ثم الصق النص.':'اختر المجموعة من واتساب بعد الضغط. يمكن ربط مجموعة كل صف من لوحة الإدارة ← مجموعات واتساب.'}</small>`);
}
function waCopy(){
 const t=$('#waT').value;
 const done=()=>toast('تم نسخ النص ✓');
 if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(done,()=>{$('#waT').select();document.execCommand('copy');done()});

}
function waSend(){window.open('https://wa.me/?text='+encodeURIComponent($('#waT').value),'_blank')}
function waGroup(link){waCopy();setTimeout(()=>window.open(link,'_blank'),400)}

let waImg={files:[],cap:''};
async function makeImage(html,name,cap,cls){
 if(typeof html2canvas==='undefined'){toast('مكتبة الصور لم تُحمَّل — تحقق من الإنترنت');return}
 toast('جارٍ تجهيز الصورة…');
 const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';
 box.innerHTML=html;document.body.appendChild(box);
 try{
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const cv=await html2canvas(box,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
  const W=cv.width,PH=Math.round(W*1.4142),parts=[];
  if(cv.height<=PH*1.08)parts.push(cv);
  else for(let y=0;y<cv.height;y+=PH){const h=Math.min(PH,cv.height-y),c=document.createElement('canvas');c.width=W;c.height=h;c.getContext('2d').drawImage(cv,0,y,W,h,0,0,W,h);parts.push(c)}
  const blobs=await Promise.all(parts.map(c=>new Promise(r=>c.toBlob(r,'image/jpeg',.92))));
  const nm=name.replace(/[\\\/:*?"<>|]/g,'');
  waImg={cap,files:blobs.map((b,i)=>new File([b],nm+(blobs.length>1?'-'+(i+1):'')+'.jpg',{type:'image/jpeg'}))};
  imgModal(cls);
 }catch(e){console.error(e);toast('تعذّر إنشاء الصورة')}
 finally{box.remove()}
}
function imgModal(cls){
 const link=(db.wa||{})[cls],urls=waImg.files.map(f=>URL.createObjectURL(f));
 openModal(`<h3>📲 الصورة جاهزة${urls.length>1?` (${urls.length} صفحات)`:''}</h3>
 <div style="max-height:46vh;overflow:auto;border-radius:14px;background:#fff">${urls.map(u=>`<img src="${u}" style="width:100%;display:block;margin-bottom:4px">`).join('')}</div>
 <div class="btns" style="margin-top:12px"><button class="btn gold" onclick="shareImg()">إرسال عبر واتساب</button><button class="btn" onclick="saveImg()">⬇ تنزيل الصورة</button></div>
 <div class="btns" style="margin-top:8px">${link?`<button class="btn blue sm" onclick="window.open(${J(link)},'_blank')">فتح مجموعة ${esc(cls)}</button>`:''}<button class="btn sm" onclick="closeModal()">إغلاق</button></div>
 <small style="color:var(--mut);display:block;margin-top:8px">زر الإرسال يفتح قائمة المشاركة، اختر واتساب ثم المجموعة. إن لم تظهر القائمة نزّل الصورة وأرفقها يدوياً.</small>`);
}
async function shareImg(){
 const files=waImg.files;
 if(navigator.canShare&&navigator.canShare({files})){
  try{await navigator.share({files,text:waImg.cap});return}catch(e){if(e&&e.name==='AbortError')return}
 }

function saveImg(){waImg.files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()},i*400))}

function printGrid(cls,sec){
 const from=$('#gF').value,to=$('#gT').value;
 if(!from||!to||from>to){toast('حدّد فترة صحيحة');return}
 const r=gridPages(cls,sec,from,to);if(r.err){toast(r.err);return}
 closeModal();printDoc(r.html,true)}
function gridPages(cls,sec,from,to){
 const list=studentsIn(cls,sec,from,to),ss=db.sessions.filter(x=>x.cls===cls&&x.sec===sec&&x.date>=from&&x.date<=to);
 if(!list.length)return{err:'لا يوجد طلاب في هذه الشعبة'};
 if(!ss.length)return{err:'لا توجد دروس مسجّلة في هذه الفترة'};
 const N=Math.max(db.lessons.length,...ss.map(x=>x.lesson)),dates=[...new Set(ss.map(x=>x.date))].sort(),by={};
 ss.forEach(x=>by[x.date+'|'+x.lesson]=x);
 const PER=Math.max(1,Math.floor(30/N)),fd=db.fd||1;
 const wd=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('ar',{weekday:'long'})}catch(e){return ''}};
 const cell=(s,d,l)=>{const x=by[d+'|'+l];if(!x||!placeOn(s,cls,sec,d))return'<td class="gx">·</td>';const m=x.marks[s.id];return m==='a'?'<td class="ga">غ</td>':m==='e'?'<td class="ge">م</td>':m==='l'?'<td class="gt">ت</td>':'<td class="gp">✓</td>'};
 const meta=`<div class="pp-meta">${esc(cls)} — شعبة ${esc(sec)} • الفترة: ${fmtD(from)} إلى ${fmtD(to)} • عدد الطلاب: ${list.length} • الدروس المسجّلة: ${ss.length}<br><span style="font-weight:400">✓ حاضر &nbsp; غ غائب &nbsp; م مجاز &nbsp; ت متأخر &nbsp; · لم يُسجَّل الدرس</span></div>`;
 let pages='';
 for(let i=0;i<dates.length;i+=PER){
  const ch=dates.slice(i,i+PER),ls=[...Array(N)].map((_,j)=>j+1);
  const t=`<table class="pp-g"><thead><tr><th rowspan="3" class="gn">#</th><th rowspan="3" class="gname" style="text-align:center">الطالب</th>${ch.map(d=>`<th colspan="${N}" class="gd">${d.slice(8)}/${d.slice(5,7)}<br><small>${wd(d)}</small></th>`).join('')}</tr>
  <tr>${ch.map(d=>ls.map(l=>`<th class="gl">${l}</th>`).join('')).join('')}</tr>
  <tr>${ch.map(d=>ls.map(l=>{const x=by[d+'|'+l];return `<th class="gs">${x?`<span>${esc(x.subject)}</span>`:''}</th>`}).join('')).join('')}</tr></thead>
  <tbody>${list.map((s,k)=>`<tr><td>${k+1}</td><td class="gname">${esc(s.name)}</td>${ch.map(d=>ls.map(l=>cell(s,d,l)).join('')).join('')}</tr>`).join('')}</tbody></table>`;
  pages+=`<div class="pp pp-land">${pHead('')}<div class="pp-title"><span>جدول الحضور والغياب</span></div>${meta}${t}${pFoot()}</div>`;
 }
 const rows=list.map((s,k)=>{let a=0,e=0,fa=0,lt=0;
  dates.forEach(d=>{if(!placeOn(s,cls,sec,d))return;const L=ss.filter(x=>x.date===d),aa=L.filter(x=>x.marks[s.id]==='a').length,ee=L.filter(x=>x.marks[s.id]==='e').length;a+=aa;e+=ee;lt+=L.filter(x=>x.marks[s.id]==='l').length;if(aa===L.length&&L.length>=fd)fa++});
  const rg=ss.filter(x=>placeOn(s,cls,sec,x.date)).length,p=rg-a-e,pc=rg?Math.round(p/rg*100):0;
  return `<tr><td>${k+1}</td><td class="gname">${esc(s.name)}</td><td style="${fa?'color:#c0283a;font-weight:800':''}">${fa}</td><td style="${a?'color:#c0283a;font-weight:800':''}">${a}</td><td>${e}</td><td style="color:#1c62c4">${lt}</td><td style="color:#0f8a5f;font-weight:800">${p}</td><td><span dir="ltr">${pc}%</span></td></tr>`}).join('');
 pages+=`<div class="pp pp-land">${pHead('')}<div class="pp-title"><span>ملخص الحضور والغياب للفترة</span></div>${meta}
 <table class="pp-s"><thead><tr><th style="width:8mm">#</th><th>الطالب</th><th>أيام غياب كاملة</th><th>دروس غائبة</th><th>دروس مجازة</th><th>مرات التأخر</th><th>دروس حاضرة</th><th>نسبة الحضور</th></tr></thead><tbody>${rows}</tbody></table>${pFoot()}</div>`;
 return{html:pages};
}


/* ---------- DASHBOARD ---------- */
let dashDate=null;
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function openDash(){dashDate=todayStr();askAdmin(()=>go('dash'),2)}
function dayAb(date){
 const ss=db.sessions.filter(x=>x.date===date),a=new Set(),l=new Set(),e=new Set();
 ss.forEach(x=>Object.entries(x.marks||{}).forEach(([id,m])=>{if(m==='a')a.add(id);else if(m==='l')l.add(id);else if(m==='e')e.add(id)}));
 return{ss,a,l,e}}
function missingLessons(date){
 const ss=db.sessions.filter(x=>x.date===date);
 if(!ss.length)return{none:true,list:[]};
 const now=new Date(),isT=date===todayStr(),nm=now.getHours()*60+now.getMinutes();
 const ended=db.lessons.map(l=>{
  if(!isT)return true;
  const t=String(l.t||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).match(/\d{1,2}[:.]\d{2}/g);
  if(!t)return false;const m=t[t.length-1].split(/[:.]/);return nm>=(+m[0])*60+(+m[1])});
 const list=[];
 Object.keys(db.structure).forEach(c=>db.structure[c].forEach(sec=>{
  if(!studentsOf(c,sec).length)return;
  const tsec=(db.tt||{})[ttKey(c,sec)],hasTT=!!tsec&&Object.values(tsec).some(a=>a&&a.some(e=>e&&(e.s||e.t)));
  if(hasTT&&!(ttDay(c,sec,date)||[]).some(e=>e&&(e.s||e.t)))return;
  const miss=[];ended.forEach((ok,i)=>{if(!ok)return;if(hasTT&&!ttGet(c,sec,date,i+1))return;if(!ss.some(x=>x.cls===c&&x.sec===sec&&x.lesson===i+1))miss.push(i+1)});
  if(miss.length)list.push({cls:c,sec,miss})}));
 return{none:false,list}}
function vDash(){
 const t=todayStr(),date=dashDate||t,{ss,a,l,e}=dayAb(date),mm=missingLessons(date),emp=m=>`<div class="empty" style="padding:6px">${m}</div>`;
 let h=`<div class="top"><div><h2>📊 لوحة المتابعة</h2><small>${fmtD(date,true)}</small></div></div>
 <div class="card"><label style="margin-top:0">التاريخ</label><input type="date" max="${t}" value="${date}" onchange="dashDate=this.value||todayStr();render()"></div>
 <div class="tiles"><div class="tile"><b style="color:var(--red)">${a.size}</b><span>غائب</span></div><div class="tile"><b style="color:#6ab8ff">${l.size}</b><span>متأخر</span></div><div class="tile"><b style="color:var(--amb)">${e.size}</b><span>مجاز</span></div></div>`;
 h+=`<div class="card"><h3>⏰ الدروس غير المسجّلة</h3>`+(mm.none?emp('لا يوجد أي تسجيل في هذا اليوم (قد يكون عطلة).'):mm.list.length?mm.list.map(x=>`<div class="sr" onclick="sel.date='${date}';sel.lesson=null;go('sec',${J({cls:x.cls,sec:x.sec})})"><div class="nm"><b>${esc(x.cls)} — شعبة ${esc(x.sec)}</b><small>${x.miss.map(n=>{const g=ttGet(x.cls,x.sec,date,n);return lessonName(n)+(g?' — '+esc(g.s||'')+(g.t?' ('+esc(g.t)+')':''):'')}).join('<br>')}</small></div></div>`).join(''):emp('✓ كل الدروس المنتهية مسجّلة'))+`</div>`;
 const rows=Object.keys(db.structure).map(c=>{
  const st=db.students.filter(s=>s.cls===c);if(!st.length||!ss.some(x=>x.cls===c))return'';
  const ab=st.filter(s=>a.has(s.id)).length,pc=Math.round(ab/st.length*100);
  return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${esc(c)}</b><span>${ab} من ${st.length} • <span dir="ltr">${pc}%</span></span></div><div class="bar"><i style="width:${ab?Math.max(pc,3):0}%"></i></div></div>`}).join('');
 const al=alv(),over=db.students.map(s=>({s,d:stats(s).fullAbs})).filter(r=>r.d>=al.a1).sort((p,q)=>q.d-p.d);
 h+=`<div class="card"><h3>🚨 تجاوزوا حد الغياب</h3><small style="color:var(--mut);display:block;margin-bottom:6px">حسب أيام الغياب الكاملة • أول إنذار عند ${al.a1} أيام</small>${over.length?over.slice(0,30).map(r=>{const l=alLevel(r.d);return `<div class="sr" onclick="go('stu',{id:'${r.s.id}'})">${av(r.s)}<div class="nm"><b>${esc(r.s.name)}</b><small>${esc(r.s.cls)} — شعبة ${esc(r.s.sec)}</small></div><div style="text-align:left"><span class="b r">${r.d} يوم</span><br><small style="color:var(--amb)">${l.n}</small></div></div>`}).join('')+(over.length>30?`<small style="color:var(--mut)">… و${over.length-30} آخرون</small>`:''):emp('✓ لا يوجد طلاب تجاوزوا الحد')}</div>`;
 h+=`<div class="card"><h3>نسبة الغياب حسب الصف</h3>${rows||emp('لا توجد بيانات لهذا اليوم')}</div>`;
 const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dstr(d),r=dayAb(k);if(r.ss.length)days.push({k,n:r.a.size})}
 const mx=Math.max(1,...days.map(x=>x.n));
 h+=`<div class="card"><h3>الغياب في آخر 14 يوماً</h3>${days.length?`<div class="trend">${days.map(x=>`<div><small>${x.n}</small><i style="height:${Math.round(x.n/mx*80)+2}px"></i><small>${x.k.slice(8)}/${x.k.slice(5,7)}</small></div>`).join('')}</div>`:emp('لا توجد بيانات')}</div>`;
 const since=(()=>{const d=new Date();d.setDate(d.getDate()-29);return dstr(d)})(),cn={};
 db.sessions.forEach(x=>{if(x.date>=since)Object.entries(x.marks||{}).forEach(([id,m])=>{if(m==='a')cn[id]=(cn[id]||0)+1})});
 const top=Object.entries(cn).map(([id,n])=>({s:db.students.find(z=>z.id===id),n})).filter(r=>r.s).sort((p,q)=>q.n-p.n).slice(0,10);
 h+=`<div class="card"><h3>الأكثر غياباً (آخر 30 يوماً)</h3>${top.length?top.map((r,i)=>`<div class="sr" onclick="go('stu',{id:'${r.s.id}'})"><div class="num">${i+1}</div>${av(r.s)}<div class="nm"><b>${esc(r.s.name)}</b><small>${esc(r.s.cls)} — شعبة ${esc(r.s.sec)}</small></div><span class="b r">${r.n} درس</span></div>`).join(''):emp('لا يوجد غياب مسجّل ✓')}</div>`;
 return h+foot();
}


/* ---------- WEEKLY TIMETABLE ---------- */
const ttKey=(c,s)=>c+'|'+s;
function ttDay(c,s,date){const d=new Date(date+'T12:00:00').getDay();return (((db.tt||{})[ttKey(c,s)])||{})[d]||null}
function ttGet(c,s,date,n){const a=ttDay(c,s,date),e=a&&a[n-1];return e&&(e.s||e.t)?e:null}
let ttS={k:null,d:0};
function openTT(){askAdmin(()=>go('tt'))}
const TT_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];

 db.tt=db.tt||{};const o=db.tt[ttS.k]=db.tt[ttS.k]||{},a=o[ttS.d]=o[ttS.d]||[];
 while(a.length<=i)a.push({s:'',t:''});

async function addUser(){
 const n=$('#unm').value.trim(),r=$('#urole').value,pin=$('#upin').value.trim();
 if(!n){toast('اكتب اسم المستخدم');return}
 if(!/^\d{4,}$/.test(pin)){toast('الرمز 4 أرقام فأكثر');return}
 const h=await sha(pin);if(!h){toast('التشفير غير متاح — افتح الموقع عبر https');return}
 if(h===db.code||(db.users||[]).some(u=>u.h===h)){toast('هذا الرمز مستخدم، اختر رمزاً آخر');return}
 db.users=db.users||[];db.users.push({id:uid(),n,r,h});
 logA('إضافة مستخدم',`${n} — ${RN[r]}`);save();toast('تمت الإضافة ✓');render()}
function delUser(id){
 const u=(db.users||[]).find(x=>x.id===id);if(!u)return;
 confirmBox(`حذف المستخدم «${esc(u.n)}»؟`,()=>{db.users=db.users.filter(x=>x.id!==id);logA('حذف مستخدم',u.n);save();closeModal();render()},'حذف')}

/* ---------- EXCEL IMPORT ---------- */
function pickXlsx(){askAdmin(()=>{
 if(typeof XLSX==='undefined'){toast('مكتبة Excel لم تُحمَّل — تحقق من الإنترنت');return}
 const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';
 i.onchange=async()=>{try{const wb=XLSX.read(await i.files[0].arrayBuffer(),{type:'array'});parseSheets(wb)}catch(e){toast('تعذّر قراءة الملف')}};i.click()})}
function parseSheets(wb){
 let all=[],hasC=false,hasS=false;
 wb.SheetNames.forEach(n=>{
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});if(!rows.length)return;
  let hr=-1,map={};
  for(let r=0;r<Math.min(rows.length,12);r++){
   const m={};rows[r].forEach((c,ix)=>{const t=norm(c);if(!t)return;
    if(t.includes('صفحه'))m.page=ix;else if(t.includes('قيد'))m.reg=ix;else if(t.includes('شعبه'))m.sec=ix;else if(t.includes('صف')||t.includes('مرحله'))m.cls=ix;else if(t.includes('اسم'))m.name=ix});
   if(m.name!==undefined){hr=r;map=m;break}
  }
  let start=hr+1;
  if(hr<0){ // no header: guess
   const cols=Math.max(...rows.slice(0,20).map(r=>r.length));let best=-1,bl=0;
   for(let c=0;c<cols;c++){const v=rows.slice(0,20).map(r=>String(r[c]??'')).filter(x=>/[\u0600-\u06FF]/.test(x));const a=v.reduce((s,x)=>s+x.length,0)/(v.length||1);if(v.length&&a>bl){bl=a;best=c}}
   if(best<0)return;map={name:best};const nums=[];for(let c=0;c<cols;c++)if(c!==best&&rows.slice(0,20).some(r=>/^\d+$/.test(String(r[c]).trim())))nums.push(c);
   if(nums[0]!==undefined)map.reg=nums[0];if(nums[1]!==undefined)map.page=nums[1];start=0;
  }
  if(map.cls!==undefined)hasC=true;if(map.sec!==undefined)hasS=true;
  for(let r=start;r<rows.length;r++){
   const g=k=>map[k]===undefined?'':String(rows[r][map[k]]??'').trim(),name=g('name');
   if(!name||/^\d+$/.test(name)||!/[\u0600-\u06FFA-Za-z]/.test(name))continue;
   all.push({name:name.replace(/\s+/g,' '),reg:g('reg'),page:g('page'),cls:g('cls'),sec:g('sec')});
  }
 });
 if(!all.length){toast('لم يُعثر على أسماء في الملف');return}
 const need=all.some(x=>!x.cls||!x.sec);
 openModal(`<h3>معاينة الاستيراد</h3><p>تم العثور على <b style="color:var(--g1)">${all.length}</b> طالب.</p>
 ${need?`<div style="color:var(--amb);font-size:13px">بعض الصفوف لا تحتوي على الصف/الشعبة — اختر الوجهة لها:</div><div class="two"><div><label>الصف</label><input id="iC" list="dc2" placeholder="مثال: الرابع العلمي"></div><div><label>الشعبة</label><input id="iS" list="ds2" placeholder="مثال: أ"></div></div><datalist id="dc2">${Object.keys(db.structure).map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="ds2">${[...new Set(Object.values(db.structure).flat())].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`:''}
 <table class="t" style="margin-top:8px"><tr><th>الاسم</th><th>القيد</th><th>الصفحة</th></tr>${all.slice().sort(cmp).slice(0,5).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.reg)}</td><td>${esc(x.page)}</td></tr>`).join('')}</table><small style="color:var(--mut)">… ويُرتَّب الجميع أبجدياً. الأسماء المكررة تُحدَّث ولا تتكرر.</small>
 <div class="btns" style="margin-top:14px"><button class="btn gold" id="iok">استيراد</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);
 $('#iok').onclick=()=>{
  const tc=$('#iC')?.value.trim()||'',ts=$('#iS')?.value.trim()||'';
  if(need&&(!tc||!ts)&&all.some(x=>(!x.cls&&!tc)||(!x.sec&&!ts))){toast('حدّد الصف والشعبة');return}
  snapshot();let add=0,upd=0;
  all.forEach(x=>{const cls=(x.cls||tc).replace(/[|\/]/g,'-'),sec=(x.sec||ts).replace(/[|\/]/g,'-');
   const d=db.students.find(s=>s.cls===cls&&s.sec===sec&&norm(s.name)===norm(x.name));
   if(d){if(x.reg)d.reg=x.reg;if(x.page)d.page=x.page;upd++}else{db.students.push({id:uid(),name:x.name,reg:x.reg,page:x.page,cls,sec,photo:''});add++}
   ensureStruct(cls,sec)});
  db.students.sort(cmp);logA('استيراد طلاب من Excel',`إضافة ${add} وتحديث ${upd}`);save();closeModal();toast(`تمت إضافة ${add} وتحديث ${upd}`);render();
 };
}

const sparts=id=>{const p=id.split('|'),m=p[0].slice(0,7);return{doc:(p[1]+'|'+p[2]+'|'+m).replace(/\//g,'_'),key:p[0]+'_'+p[3],cls:p[1],sec:p[2],month:m}};

function cbadge(){const e=$('#syncb');if(!e)return;let k='',t;
 if(!cloud.on){t='💾 محلي'}
 else if(cloud.err){k='e';t='⚠️ خطأ مزامنة'}
 else if(!navigator.onLine){k='w';t='📴 غير متصل — يُحفظ محلياً'}
 else if(cloud.pend.st||cloud.pend.se||cloud.pend.cfg){k='w';t='⏳ جارٍ المزامنة'}
 else{k='ok';t='☁️ متزامن'}
 e.className=k;e.textContent=t}
function whenClean(k,fn){if(cloud.dirty)cloud.defer[k]=fn;else fn()}
function flushDefer(){const d=cloud.defer;cloud.defer={};Object.values(d).forEach(f=>f())}
function softRender(){
 if(!db)return;
 const a=document.activeElement,busy=view.n==='att'||$('#modal').classList.contains('show')||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
 if(busy){cloud.pr=true;return}
 render()}
setInterval(()=>{if(cloud.pr){cloud.pr=false;softRender()}},1500);

function cloudErr(e){console.error(e);cloud.err=true;cbadge();toast(e&&e.code==='permission-denied'?'لا توجد صلاحية — راجع قواعد Firestore وتفعيل Anonymous':'تعذّرت المزامنة')}

function cloudSave(){
 if(!cloud.on)return;
 const FP=firebase.firestore.FieldPath,FV=firebase.firestore.FieldValue,ops=[];
 const ids=new Set();
 db.students.forEach(s=>{ids.add(s.id);const o=stuO(s);if(!sameStu(cloud.st[s.id],o))ops.push(b=>b.set(FS.collection('students').doc(s.id),o))});
 Object.keys(cloud.st).forEach(id=>{if(!ids.has(id))ops.push(b=>b.delete(FS.collection('students').doc(id)))});
 const up={},sids=new Set(),U=p=>up[p.doc]=up[p.doc]||{p,sets:{},dels:[]};
 db.sessions.forEach(x=>{sids.add(x.id);if(cloud.se[x.id]!==stab(x)){const p=sparts(x.id);U(p).sets[p.key]=x}});
 Object.keys(cloud.se).forEach(id=>{if(!sids.has(id)){const p=sparts(id);U(p).dels.push(p.key)}});
 Object.entries(up).forEach(([did,u])=>{
  const ref=FS.collection('sessions').doc(did),keys=Object.keys(u.sets);
  if(keys.length)ops.push(b=>b.set(ref,{cls:u.p.cls,sec:u.p.sec,month:u.p.month,lessons:u.sets},{mergeFields:['cls','sec','month',...keys.map(k=>new FP('lessons',k))]}));
  if(u.dels.length)ops.push(b=>{const o={};u.dels.forEach(k=>{o[k]=FV.delete()});b.set(ref,{lessons:o},{merge:true})});
 });
 const c=cfgObj();if(stab(c)!==cloud.cfg)ops.push(b=>b.set(FS.collection('meta').doc('config'),c));
 for(let i=0;i<ops.length;i+=200){const b=FS.batch();ops.slice(i,i+200).forEach(f=>f(b));b.commit().catch(cloudErr)}
}

async function nextNum(){
 if(cloud.on){
  try{
   const ref=FS.collection('meta').doc('counter');
   const n=await Promise.race([FS.runTransaction(async t=>{const d=await t.get(ref);const n=((d.exists&&d.data().n)||0)+1;t.set(ref,{n});return n}),new Promise((_,r)=>setTimeout(r,5000))]);
   db.counter=n;return n
  }catch(e){}
 }
 db.counter=(db.counter||0)+1;save();
 if(cloud.on)FS.collection('meta').doc('counter').set({n:db.counter}).catch(()=>{});
 return db.counter}

function migrate(){
 const L=cloud.legacy;
 if(L){db=Object.assign(defDB(),L);if(L.students&&L.students.length)toast('جارٍ رفع بيانات هذا الجهاز إلى السحابة…')}
 FS.collection('meta').doc('counter').set({n:db.counter||0}).catch(()=>{});
 save();softRender()}

function startListeners(){
 const col=(name,key,ap)=>FS.collection(name).onSnapshot({includeMetadataChanges:true},sn=>{
  cloud.err=false;cloud.pend[key]=sn.metadata.hasPendingWrites;
  if(!sn.metadata.fromCache)cloud.srv[key]=1;
  cbadge();
  if(sn.empty&&sn.metadata.fromCache&&!cloud.srv[key])return;
  if(cloud.got[key]&&!sn.docChanges().length)return;
  cloud.got[key]=1;
  whenClean(key,()=>ap(sn));
 },cloudErr);
 col('students','st',sn=>{
  cloud.st={};
  db.students=sn.docs.map(d=>{const o=stuO(d.data());cloud.st[d.id]=o;return Object.assign({id:d.id},o)});
  softRender()});
 col('sessions','se',sn=>{
  cloud.se={};const out=[];
  sn.docs.forEach(d=>{Object.values(d.data().lessons||{}).forEach(x=>{if(x&&x.id){out.push(x);cloud.se[x.id]=stab(x)}})});
  db.sessions=out;softRender()});
 FS.collection('meta').doc('config').onSnapshot({includeMetadataChanges:true},d=>{
  cloud.err=false;cloud.pend.cfg=d.metadata.hasPendingWrites;cbadge();
  if(!d.exists){if(!d.metadata.fromCache&&!cloud.mig){cloud.mig=true;migrate()}return}
  const c=d.data(),j=stab({structure:c.structure,lessons:c.lessons,behaviors:c.behaviors,code:c.code,wa:c.wa||{},fd:c.fd||1,tt:c.tt||'{}',users:c.users||'[]',al:c.al||{},v:c.v||1});
  if(j===cloud.cfg)return;
  whenClean('cfg',()=>{
   if(Array.isArray(c.structure)){db.structure={};c.structure.forEach(x=>{db.structure[x.c]=x.s||[]})}
   ['lessons','behaviors','code'].forEach(k=>{if(c[k]!==undefined)db[k]=c[k]});db.wa=c.wa||{};db.fd=c.fd||1;try{db.tt=JSON.parse(c.tt||'{}')}catch(e){db.tt={}}try{db.users=JSON.parse(c.users||'[]')}catch(e){db.users=[]}db.al=c.al||{};
   cloud.cfg=j;softRender()});
 },cloudErr);
 FS.collection('meta').doc('counter').onSnapshot(d=>{if(d.exists&&db)db.counter=Math.max(db.counter||0,d.data().n||0)},()=>{});
}

async function cloudInit(){
 cloud.tried=true;cloud.err=false;
 if(!FIREBASE_CONFIG.apiKey||typeof firebase==='undefined'||!firebase.firestore){cbadge();return}
 if(location.protocol==='file:'){cbadge();toast('المزامنة تحتاج فتح الموقع من رابط https وليس كملف على الجهاز');return}
 try{
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  if(!FS){FS=firebase.firestore();FS.settings({ignoreUndefinedProperties:true});try{await FS.enablePersistence({synchronizeTabs:true})}catch(e){}}
  const au=firebase.auth();
  const u=await new Promise(r=>{const un=au.onAuthStateChanged(x=>{un();r(x)})});
  if(!u)await au.signInAnonymously();
 }catch(e){console.error(e);cloud.err=true;cbadge();toast('تعذّر الاتصال بـ Firebase — تحقق من الإعدادات أو الإنترنت');return}
 cloud.on=true;startListeners();cbadge()}
addEventListener('online',()=>{cbadge();if(!cloud.on&&cloud.tried&&FIREBASE_CONFIG.apiKey)cloudInit()});
addEventListener('offline',cbadge);


/* ---------- PWA (تثبيت التطبيق + العمل بدون إنترنت) ---------- */

const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;

 :`<h3>📲 تثبيت التطبيق</h3><p>في Chrome: اضغط القائمة <b>⋮</b> ثم <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</p><button class="btn gold full" onclick="closeModal()">حسناً</button>`)}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e)));

(async()=>{
 const d=await idbGet('db');
 db=d?Object.assign(defDB(),d):defDB();if(!d)idbPut('db',db);

 idbGet('lastExport').then(v=>{if(v)lastExport=v;else{lastExport=Date.now();idbPut('lastExport',lastExport)}});
 loadBks().then(()=>{if(view.n==='admin')render()});setTimeout(autoBackup,8000);
 history.replaceState({n:'home',p:{}},'');render();cbadge();
 cloudInit();
})();
