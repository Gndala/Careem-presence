<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1438">
<title>نظام الحضور والغياب — ثانوية نهج البلاغة الأهلية للبنين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--g1:#f6d56a;--g2:#d9a521;--g3:#a87a12;--navy:#0a1438;--navy2:#13245f;--ink:#f5f1e3;--mut:#a3acd2;--red:#ff5a6a;--amb:#ffb43a;--grn:#2ee6a0;--card:rgba(255,255,255,.06);--bd:rgba(246,213,106,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:#060b22;color:var(--ink);min-height:100vh;padding-bottom:92px;direction:rtl;font-size:15px;line-height:1.6}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 520px at 90% -10%,#2447c455,transparent 60%),radial-gradient(700px 500px at -10% 35%,#d9a52124,transparent 60%),linear-gradient(180deg,#0a1438,#060b22)}
.orb{position:fixed;border-radius:50%;filter:blur(70px);z-index:-1;opacity:.28;pointer-events:none;animation:fl 16s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:#f6d56a;top:20%;left:-120px}.o2{width:340px;height:340px;background:#2a4bd6;bottom:5%;right:-140px;animation-delay:-6s}
@keyframes fl{to{transform:translate(40px,-60px) scale(1.15)}}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{to{background-position:200% 0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:760px;margin:auto;padding:14px}
.gt{background:linear-gradient(100deg,var(--g1),#fff6c9 40%,var(--g2) 70%,var(--g1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
/* hero */
.hero{text-align:center;padding:22px 10px 8px}
.logo{width:132px;height:132px;border-radius:34px;background:#fbf8ef;object-fit:contain;padding:6px;box-shadow:0 0 0 2px var(--g2),0 0 44px #f6d56a55,0 18px 40px #0009;animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
.hero h1{margin:14px 0 0;font-size:26px;font-weight:900;line-height:1.35}
.hero .en{color:var(--g1);letter-spacing:1.5px;font-weight:600;font-size:13px;opacity:.85}
.hero .dt{margin-top:8px;color:var(--mut);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px 6px;text-align:center;backdrop-filter:blur(10px)}
.tile b{display:block;font-size:26px;font-weight:900;color:var(--g1);line-height:1.2}.tile span{font-size:12px;color:var(--mut)}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px;margin:12px 0;backdrop-filter:blur(10px)}
.card h3{margin:0 0 10px;font-size:17px;font-weight:800;color:var(--g1)}
.cls{position:relative;overflow:hidden}
.cls:before{content:"";position:absolute;top:0;bottom:0;right:0;width:5px;background:linear-gradient(var(--g1),var(--g3))}
.cls .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-right:6px}
.cls .h b{font-size:18px;font-weight:800}.cls .h small{color:var(--mut)}
.secs{display:flex;flex-wrap:wrap;gap:8px}
.sec{flex:1 1 90px;background:linear-gradient(160deg,#1b2f78,#111d4d);border:1px solid var(--bd);border-radius:16px;padding:10px;text-align:center;cursor:pointer;transition:.2s}
.sec:active{transform:scale(.96)}.sec:hover{border-color:var(--g1)}
.sec b{display:block;font-size:20px;color:var(--g1);font-weight:900}.sec small{color:var(--mut);font-size:12px}
/* buttons */
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.1);transition:.15s}
.btn:active{transform:scale(.97)}
.gold{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));color:#2a1c00;box-shadow:0 8px 22px #d9a52144}
.red{background:linear-gradient(135deg,#ff7b88,#e0384c);color:#fff}
.blue{background:linear-gradient(135deg,#4d7bff,#2447c4);color:#fff}
.full{width:100%}.sm{padding:8px 12px;border-radius:12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1 1 130px}
/* forms */
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:11px 13px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--g1);box-shadow:0 0 0 3px #f6d56a22}
select option{color:#000}
input[type=date]{color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* top bar */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 8px}
.top h2{margin:0;font-size:19px;font-weight:800}.top small{color:var(--mut)}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-size:20px;cursor:pointer;flex:none}
.tabs{display:flex;background:rgba(255,255,255,.07);border-radius:16px;padding:4px;margin:10px 0}
.tabs button{flex:1;border:0;background:none;padding:10px 3px;font-size:13px;border-radius:12px;font-weight:700;cursor:pointer;color:var(--mut)}
.tabs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#2a1c00}
/* lessons */
.ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.l{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:16px;padding:9px 4px;text-align:center;cursor:pointer;position:relative;transition:.15s}
.l b{display:block;font-size:15px}.l small{font-size:11px;color:var(--mut);display:block;direction:ltr}
.l.on{border-color:var(--g1);background:linear-gradient(160deg,#27428f,#16286b);box-shadow:0 0 0 3px #f6d56a2a}
.l.done:after{content:"✓";position:absolute;top:4px;left:7px;color:var(--grn);font-weight:900}
/* attendance */
.sticky{position:sticky;top:0;z-index:20;background:linear-gradient(#0a1438f2,#0a1438e0);backdrop-filter:blur(14px);margin:-14px -14px 10px;padding:12px 14px 10px;border-bottom:1px solid var(--bd)}
.pills{display:flex;gap:8px;margin-top:8px}
.pill{flex:1;text-align:center;border-radius:14px;padding:5px;font-weight:800;font-size:13px}
.pill b{font-size:18px;display:block;line-height:1.1}
.p-ok{background:#2ee6a01f;color:var(--grn)}.p-ab{background:#ff5a6a22;color:var(--red)}.p-ex{background:#ffb43a22;color:var(--amb)}
.row{background:var(--card);border:1.5px solid rgba(255,255,255,.1);border-radius:20px;padding:10px;margin:9px 0;transition:.15s}
.row.a{background:#ff5a6a1c;border-color:#ff5a6a88}.row.e{background:#ffb43a1c;border-color:#ffb43a88}
.row .t{display:flex;align-items:center;gap:10px}
.num{width:28px;text-align:center;color:var(--mut);font-weight:800;font-size:13px;flex:none}
.av{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--navy2),#26408f);border:1.5px solid var(--bd);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:900;color:var(--g1);font-size:18px}
.av img{width:100%;height:100%;object-fit:cover}
.nm{flex:1;min-width:0}.nm b{display:block;font-weight:700;line-height:1.35}.nm small{color:var(--mut);font-size:12px}
.acts{display:grid;grid-template-columns:1fr 1fr 50px 50px;gap:8px;margin-top:9px}
.acts button{border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);padding:10px 0;font-weight:800;cursor:pointer;position:relative}
.acts .bA.on{background:linear-gradient(135deg,#ff7b88,#e0384c);border-color:transparent;color:#fff}
.acts .bE.on{background:linear-gradient(135deg,#ffcf6b,#f0952a);border-color:transparent;color:#2a1700}
.acts .bB i{position:absolute;top:-6px;left:-4px;background:var(--g1);color:#2a1c00;border-radius:10px;font-size:11px;font-style:normal;min-width:19px;padding:0 4px;font-weight:900}
.acts .bB.has{border-color:var(--g1);color:var(--g1)}
.acts .bW.has{border-color:#25D366;background:#25D36624}
.acts .bW:not(.has){opacity:.55}
.savebar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#060b22 35%)}
.savebar .btn{max-width:732px;display:block;margin:auto}
/* student rows */
.sr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:10px;margin:8px 0;cursor:pointer}
.sr .bd{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.b{font-size:11px;font-weight:800;border-radius:10px;padding:1px 8px}
.b.r{background:#ff5a6a26;color:var(--red)}.b.a{background:#ffb43a26;color:var(--amb)}.b.g{background:#2ee6a024;color:var(--grn)}.b.y{background:#f6d56a22;color:var(--g1)}
/* profile */
.prof{display:flex;gap:14px;align-items:center}
.prof .ph{width:104px;height:124px;border-radius:22px;overflow:hidden;border:2px solid var(--g2);background:linear-gradient(135deg,var(--navy2),#26408f);display:grid;place-items:center;flex:none;font-size:40px;font-weight:900;color:var(--g1);box-shadow:0 0 30px #f6d56a33}
.prof .ph img{width:100%;height:100%;object-fit:cover}
.prof h2{margin:0 0 4px;font-size:20px}.prof p{margin:0;color:var(--mut);font-size:13px}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.k{border-radius:18px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.1)}
.k b{display:block;font-size:30px;font-weight:900;line-height:1.1}.k span{font-size:12px;color:var(--mut)}
.k.r{background:#ff5a6a18}.k.r b{color:var(--red)}.k.a{background:#ffb43a18}.k.a b{color:var(--amb)}.k.g{background:#2ee6a016}.k.g b{color:var(--grn)}.k.y{background:#f6d56a14}.k.y b{color:var(--g1)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{color:var(--g1);text-align:right;padding:6px 4px;border-bottom:1px solid var(--bd)}
table.t td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:30px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);font-weight:700;cursor:pointer;font-size:14px}
.chip.neg.on{background:#ff5a6a;border-color:#ff5a6a;color:#fff}.chip.pos.on{background:var(--grn);border-color:var(--grn);color:#02281b}
.chip b{margin-right:8px;color:var(--red);cursor:pointer}
/* nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#080f2ce6;backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
#nav button{flex:1;max-width:200px;border:0;background:none;color:var(--mut);padding:6px;border-radius:14px;font-weight:700;cursor:pointer;font-size:12px}
#nav button span{display:block;font-size:20px}#nav button.on{color:var(--g1);background:#f6d56a14}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:26px 0 8px}.foot b{color:var(--g1)}
/* modal */
#modal{position:fixed;inset:0;z-index:60;background:#02061acc;backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#14246a,#0a1438);border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 6px;font-size:19px}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:28px}}
.pin{text-align:center;font-size:26px;letter-spacing:10px}
.shake{animation:shake .35s}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);z-index:99;background:#fff;color:#0a1438;padding:11px 20px;border-radius:30px;font-weight:800;box-shadow:0 10px 30px #0007;transition:.3s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.camwrap{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
.camwrap video{flex:1;width:100%;object-fit:cover;min-height:0}
.camtools{display:flex;justify-content:space-around;align-items:center;padding:18px;background:#000}
.camtools button{background:#ffffff22;border:0;color:#fff;border-radius:14px;padding:12px 18px;font-weight:700}
.camtools .shutter{width:70px;height:70px;border-radius:50%;background:#fff;border:5px solid #ffffff88}
.edph{width:110px;height:130px;margin:6px auto;border-radius:22px;overflow:hidden;border:2px solid var(--g2);background:#0a1438;display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center}
.edph img{width:100%;height:100%;object-fit:cover}
details.card summary{cursor:pointer;font-weight:800;color:var(--g1);font-size:16px;list-style:none}
details.card[open] summary{margin-bottom:10px}
.lt{display:flex;gap:8px;align-items:center;margin:6px 0}.lt span{width:80px;font-weight:700;flex:none}
#syncb{position:fixed;top:6px;left:8px;z-index:40;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;background:#0a1438cc;border:1px solid var(--bd);color:var(--mut);pointer-events:none}#syncb.ok{color:var(--grn)}#syncb.w{color:var(--amb)}#syncb.e{color:var(--red)}
/* ===== ARCHIVE ===== */
.arck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.arck div{background:var(--card);border:1px solid var(--bd);border-radius:14px;text-align:center;padding:8px 2px}
.arck b{display:block;font-size:22px;line-height:1.3}.arck span{font-size:11px;color:var(--mut)}
.arck .r b{color:var(--red)}.arck .a b{color:var(--amb)}.arck .g b{color:var(--grn)}
.arcl{font-size:12px;color:var(--mut);margin:2px 0 4px}
.arcw{overflow-x:auto;border-radius:14px;border:1px solid var(--bd);margin:6px 0 12px}
table.at{width:100%;border-collapse:collapse;font-size:15px}
table.at th{background:#13245f;color:var(--g1);padding:10px 8px;font-size:14px;font-weight:800;white-space:nowrap;line-height:1.5;border:1px solid #ffffff1a}
table.at th small{display:block;font-weight:600;color:var(--mut);font-size:11px}
table.at td{border:1px solid #ffffff1a;padding:11px 8px;text-align:center;min-width:66px}
table.at td.ar{background:#ff5a6a30}table.at td.ae{background:#ffb43a30}
table.at th.nm,table.at td.nm{position:sticky;right:0;z-index:1}table.at th.nm{background:#13245f;z-index:2}table.at td.nm{background:#101b4a}
table.at td.nm{text-align:right;font-weight:700;min-width:130px}
table.at .ar{color:var(--red);font-weight:900}.at .ae{color:var(--amb);font-weight:900}.at .ap{color:var(--grn)}.at .az{color:var(--mut)}
.dchips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.dchips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 12px;font-weight:700;font-size:12px;cursor:pointer}
.dchips button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#2a1c00;border-color:transparent}
/* ================= PRINT PAPER ================= */
#printArea{display:none}
@page{size:A4;margin:8mm}
@media print{
 html,body{background:#fff!important;padding:0!important;color:#000}
 body:before,.orb{display:none!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.pp-head{display:flex;align-items:center;gap:12px;border-bottom:3px double #b8892b;padding-bottom:8px;position:relative}
.pp-head img{width:80px;height:80px;object-fit:contain}
.pp-t{flex:1;text-align:center}.pp-t .a{font-size:22px;font-weight:900}.pp-t .e{font-size:12px;letter-spacing:.8px;color:#8a6417;font-weight:700}.pp-t .rg{font-size:11px;color:#556}
.pp-no{width:80px;text-align:center;font-size:11px;color:#556}.pp-no b{display:block;color:#b8892b;font-size:15px}
.pp-title{text-align:center;margin:12px 0;position:relative}
.pp-title span{display:inline-block;padding:5px 40px;background:linear-gradient(90deg,#0b1a4a,#1b3a9a);color:#f6d56a;font-weight:900;font-size:19px;border-radius:30px}
.pp-info{display:flex;gap:14px;align-items:stretch;margin-bottom:10px;position:relative}
.pp-info .ph{width:104px;height:128px;border:2px solid #b8892b;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#aaa;font-size:11px;flex:none;background:#faf6e8}
.pp-info .ph img{width:100%;height:100%;object-fit:cover}
.pp-info table{flex:1;border-collapse:collapse}
.pp-info td{border:1px solid #d8c796;padding:4px 9px}.pp-info td:nth-child(odd){background:#f7f0d9;font-weight:800;width:17%;white-space:nowrap}
.pp h4{margin:12px 0 5px;font-size:14px;color:#0b1a4a;border-right:5px solid #b8892b;padding-right:8px;position:relative}
.pp-k{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:relative}
.pp-k div{border:1.5px solid #d8c796;border-radius:10px;text-align:center;padding:5px 2px;background:#fffdf5}
.pp-k b{display:block;font-size:22px;line-height:1.2;color:#0b1a4a}.pp-k span{font-size:11px;color:#556}
.pp-k .r b{color:#c0283a}.pp-k .a b{color:#c27a00}.pp-k .g b{color:#0f8a5f}
table.pp-t2{width:100%;border-collapse:collapse;position:relative;font-size:12px}
table.pp-t2 th{background:#0b1a4a;color:#f6d56a;padding:4px 6px;border:1px solid #0b1a4a}
table.pp-t2 td{border:1px solid #d8c796;padding:3px 6px;text-align:center}
table.pp-t2 tr:nth-child(even) td{background:#fbf7e8}
.pp-sig{display:flex;justify-content:space-around;margin-top:26px;text-align:center;position:relative}
.pp-sig div{width:30%;border-top:1.5px dashed #0b1a4a;padding-top:4px;font-weight:700}
.pp-foot{margin-top:14px;border-top:3px double #b8892b;padding-top:6px;display:flex;justify-content:space-between;font-size:11px;color:#556;position:relative}
.pp-foot b{color:#8a6417}
.pp-box{border:2px solid #b8892b;border-radius:14px;padding:10px 14px;margin:10px 0;background:#fffdf5;position:relative;font-size:14px;line-height:2}
.pp-warn{border-color:#a3202f;outline-color:#a3202f}
.pp-warn .pp-title span{background:linear-gradient(90deg,#7e1220,#c0283a);font-size:26px;padding:4px 56px}
.pp-warn .pp-head,.pp-warn .pp-foot{border-color:#a3202f}
.pp-warn h4{border-color:#a3202f}
.pp-tear{border-top:2px dashed #666;margin-top:18px;padding-top:10px;position:relative}
.pp-tear:before{content:"✂";position:absolute;top:-13px;right:14px;background:#fff;padding:0 6px;font-size:16px}
.pp-line{display:inline-block;min-width:130px;border-bottom:1.5px dotted #0b1a4a;text-align:center;font-weight:800}
/* ===== TICKET DOCS ===== */
.tk,.tk *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
.tk{--c1:#0b1a4a;--c2:#1b3a9a;--ac:#d4a62a;--soft:#f3f6ff;font-family:'Cairo',sans-serif;direction:rtl;color:#0b1a4a;background:#fff;border:2px solid var(--c1);border-radius:24px;position:relative;font-size:13px;line-height:1.7;page-break-after:always}
.tk:last-child{page-break-after:auto}
.tk.warn{--c1:#7e1220;--c2:#c0283a;--ac:#f0b429;--soft:#fff4f4}
.tk.pledge{--c1:#0b3a6e;--c2:#1f7ac0;--ac:#e0b43a;--soft:#f0f7ff}
.tk.leave{--c1:#0b5a44;--c2:#16a379;--ac:#e0b43a;--soft:#effaf5}
.tk .wm{position:absolute;left:50%;top:50%;width:320px;height:320px;transform:translate(-50%,-50%);opacity:.05;object-fit:contain;pointer-events:none}
.tk-h{display:flex;align-items:center;gap:12px;padding:14px 18px 16px;background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;position:relative;border-radius:21px 21px 0 0}
.tk-h:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,var(--ac) 0 14px,transparent 14px 20px)}
.tk-h .lg{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;border:3px solid var(--ac);flex:none}
.tk-h .tt{flex:1;text-align:center}.tk-h .tt small{display:block;font-size:11px;opacity:.85}.tk-h .tt b{display:block;font-size:20px;font-weight:900;color:#fff}.tk-h .tt i{font-style:normal;font-size:11px;letter-spacing:.8px;color:var(--ac);font-weight:700}
.tk-h .tb{min-width:100px;text-align:center;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);border-radius:16px;padding:5px 8px;flex:none}
.tk-h .tb span{font-size:22px;display:block;line-height:1.2}.tk-h .tb b{display:block;font-size:14px;font-weight:900;color:var(--ac)}.tk-h .tb em{display:block;font-style:normal;font-size:10.5px;opacity:.92}
.tk-b{padding:14px 18px;position:relative}
.tk-s{display:flex;gap:14px;align-items:center;background:var(--soft);border:1.5px dashed var(--c2);border-radius:20px;padding:10px 12px}
.tk-s .ph{width:96px;height:120px;border-radius:16px;overflow:hidden;border:3px solid var(--c1);background:#fff;display:grid;place-items:center;color:#9aa;font-size:11px;flex:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ac)}
.tk-s .ph img{width:100%;height:100%;object-fit:cover}
.tk-s .in{flex:1}.tk-s h2{margin:0 0 6px;font-size:21px;font-weight:900;color:var(--c1)}
.tk-s .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tk-s .g div{background:#fff;border-radius:12px;border:1px solid #dde2f0;padding:3px 6px;text-align:center}
.tk-s .g small{display:block;font-size:10.5px;color:#667}.tk-s .g b{font-size:14px;color:var(--c1)}
.tk-s .bc{height:24px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--c1) 0 2px,transparent 2px 4px,var(--c1) 4px 5px,transparent 5px 8px,var(--c1) 8px 11px,transparent 11px 13px);border-radius:2px;opacity:.85}
.tk-per{margin:8px 0 0;font-size:12px;color:#556;text-align:center}
.tk-k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;position:relative}
.tk-k div{background:var(--soft);border-radius:16px;text-align:center;padding:6px 3px;border:1.5px solid #e1e6f5}
.tk-k b{display:block;font-size:24px;font-weight:900;line-height:1.2;color:var(--c1)}.tk-k span{font-size:11px;color:#556}
.tk-k .r b{color:#c0283a}.tk-k .a b{color:#c27a00}.tk-k .g b{color:#0f8a5f}
.tk-sh{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--soft);border:1.5px dashed var(--c2);border-radius:18px;padding:10px}
.tk-sh div{background:#fff;border-radius:12px;border:1px solid #dde2f0;text-align:center;padding:4px}.tk-sh small{display:block;font-size:10.5px;color:#667}.tk-sh b{font-size:16px;color:var(--c1)}
.tk h4{margin:14px 0 6px;font-size:14px;font-weight:900;color:var(--c1);display:flex;align-items:center;gap:8px;position:relative}
.tk h4:before{content:"";width:6px;height:18px;border-radius:4px;background:linear-gradient(var(--c2),var(--ac))}
.tk-chip{display:inline-block;padding:1px 12px;border-radius:20px;border:1.5px solid;margin:2px;font-weight:700;font-size:12px}
.tk-chip.neg{color:#c0283a;border-color:#c0283a;background:#fff4f4}.tk-chip.pos{color:#0f8a5f;border-color:#0f8a5f;background:#effaf5}
table.tk-t{width:100%;border-collapse:collapse;font-size:12px;position:relative}
table.tk-t thead{display:table-header-group}
table.tk-t th{background:var(--c1);color:#fff;padding:5px 6px;font-weight:800}
table.tk-t td{border-bottom:1px solid #e3e7f3;padding:4px 6px;text-align:center}
table.tk-t tr{page-break-inside:avoid}
table.tk-t tbody tr:nth-child(even) td{background:var(--soft)}
.tk.arcpg{display:flex;flex-direction:column}.tk.arcpg .tk-b{flex:1}
.tk-mini{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border:1.5px dashed var(--c2);border-radius:14px;padding:6px 14px;font-weight:800;color:var(--c1);margin-bottom:6px}
table.tk-t.big th.nmc{width:22%}table.tk-t.big td.st{white-space:nowrap;font-size:12px;padding:5px 3px}table.tk-t.big td:nth-child(2){line-height:1.35;padding:5px 6px}table.tk-t.big tbody td{padding-top:5px;padding-bottom:5px}
table.tk-t.big{font-size:13.5px}table.tk-t.big th,table.tk-t.big td{padding:7px 4px;border:1px solid #cfd6ea}table.tk-t.big td.rd{background:#fde2e5}table.tk-t.big td.am{background:#fff0cf}table.tk-t.big td.gn{background:#e8f8f1}
.tk-lg{font-size:11.5px;color:#556;margin:2px 0 4px}
table.tk-t .rd{color:#c0283a;font-weight:900}.tk-t .am{color:#c27a00;font-weight:800}.tk-t .gn{color:#0f8a5f;font-weight:800}
table.tk-t tr.tot td{background:var(--c1)!important;color:#fff;font-weight:900}
.tk-c{text-align:center;margin:12px 0 4px}
.tk-lv{display:inline-block;background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;font-weight:900;font-size:20px;padding:3px 38px;border-radius:30px;border:2.5px solid var(--ac)}
.tk-box{background:var(--soft);border:1.5px solid var(--c2);border-radius:18px;padding:10px 16px;font-size:14px;line-height:2;margin:10px 0;position:relative}
.tk-sig{display:flex;gap:12px;margin-top:22px;position:relative}.tk-sig div{flex:1;text-align:center;border-top:1.5px dashed var(--c1);padding-top:4px;font-weight:700;font-size:12.5px}
.tk-pf{position:relative;border-top:2.5px dashed var(--c2);margin:20px -20px 0}
.tk-pf:before,.tk-pf:after{content:"";position:absolute;top:-14px;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--c1);border-top-color:transparent;border-right-color:transparent;transform:rotate(45deg)}
.tk-pf:before{right:-15px}
.tk-pf:after{left:-15px;border-top-color:var(--c1);border-right-color:var(--c1);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(45deg)}
.tk-stub{padding-top:10px;font-size:13px;line-height:2.1;position:relative}
.tk-ln{display:inline-block;min-width:130px;border-bottom:1.5px dotted var(--c1);text-align:center;font-weight:800}
.tk-ft{display:flex;justify-content:space-between;padding:8px 18px;background:var(--soft);border-top:1.5px solid #e1e6f5;border-radius:0 0 21px 21px;font-size:11px;color:#556;position:relative}
.tk-ft b{color:var(--c1)}
.chk{display:flex;gap:10px;align-items:center;margin:12px 0 4px;font-weight:700;cursor:pointer}.chk input{width:20px;height:20px;margin:0;flex:none}
</style>

/* ---------- storage (IndexedDB) ---------- */
let db=null,mem={};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('nahj_att',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej(e)}})}
async function idbGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return mem[k]||null}}
async function idbPut(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){mem[k]=v}}
let st_;function save(){clearTimeout(st_);cloud.dirty=true;st_=setTimeout(()=>{cloud.dirty=false;idbPut('db',db);cloudSave();flushDefer()},150)}

 if(isAdmin())return cb();
 openModal(`<h3>🔐 رمز الإدارة</h3><div style="color:var(--mut);font-size:13px">هذا الإجراء يحتاج إلى الرمز السري.</div>

 <div class="btns"><button class="btn gold" id="pinok">تأكيد</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);
 const inp=$('#pin');setTimeout(()=>inp.focus(),80);
 const go_=()=>{if(inp.value===db.code){adminUntil=Date.now()+10*60*1000;closeModal();cb()}else{inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');inp.value='';toast('الرمز غير صحيح')}};

}

function stats(s,rg){

 Object.keys(byD).sort().forEach(d=>{
  const L=byD[d].sort((a,b)=>a.lesson-b.lesson);r.days++;
  const a=L.filter(x=>x.marks[s.id]==='a').length,e=L.filter(x=>x.marks[s.id]==='e').length;
  if(a===L.length)r.fullAbs++;else if(e===L.length)r.fullExc++;else{r.partAbs+=a;r.partExc+=e}
  r.absL+=a;r.excL+=e;
  L.forEach(x=>{
   const m=x.marks[s.id];if(m)r.log.push({date:d,lesson:x.lesson,subject:x.subject,teacher:x.teacher,st:m});
   const b=(x.beh&&x.beh[s.id])||[],nt=(x.notes&&x.notes[s.id])||'';
   if(b.length||nt){r.behLog.push({date:d,lesson:x.lesson,subject:x.subject,teacher:x.teacher,tags:b,note:nt});
    b.forEach(t=>{r.beh[t]=(r.beh[t]||0)+1;const k=(db.behaviors.find(z=>z.n===t)||{}).k;if(k==='pos')r.pos++;else r.neg++})}
  });
 });
 return r;
}

/* ---------- ARCHIVE: غيابات الشعبة ليوم معيّن ---------- */
let arcD=todayStr(),arcAll=false;
function arcData(cls,sec,date){
 const ses=db.sessions.filter(x=>x.cls===cls&&x.sec===sec&&x.date===date),list=studentsOf(cls,sec);
 const L=db.lessons.map((l,i)=>({n:i+1,t:l.t||'',ses:ses.find(x=>x.lesson===i+1)||null}));
 ses.forEach(x=>{if(!L.some(q=>q.n===x.lesson))L.push({n:x.lesson,t:'',ses:x})});
 L.sort((a,b)=>a.n-b.n);
 L.forEach(q=>{q.a=q.ses?list.filter(s=>q.ses.marks[s.id]==='a').length:0;q.e=q.ses?list.filter(s=>q.ses.marks[s.id]==='e').length:0});
 const rec=L.filter(q=>q.ses);
 const rows=list.map(s=>{const m=L.map(q=>q.ses?(q.ses.marks[s.id]||'p'):null),a=m.filter(v=>v==='a').length,e=m.filter(v=>v==='e').length;
  return{s,m,a,e,full:rec.length>0&&a===rec.length}}).filter(r=>arcAll||r.a||r.e);
 const teachers=[...new Set(rec.map(q=>q.ses.teacher).filter(Boolean))];
 return{L,rec,rows,teachers,list,tot:{stu:rows.filter(r=>r.a).length,full:rows.filter(r=>r.full).length,exc:rows.filter(r=>!r.a&&r.e).length}}}
const arcSt=r=>r.full?'غياب يوم كامل':r.a?'غياب دروس':r.e?'مجاز':'حاضر';
const arcSc=r=>r.a?'ar':r.e?'ae':'ap',arcPc=r=>r.a?'rd':r.e?'am':'gn';
const arcCell=v=>v==='a'?['غائب','ar']:v==='e'?['مجاز','ae']:v==='p'?['✓','ap']:['—','az'];
const arcName=(cls,sec,d)=>('أرشيف_غياب_'+cls+'_شعبة_'+sec+'_'+d).replace(/[\\\/:*?"<>|\s]+/g,'_');

function arcView(cls,sec){

 <div class="card"><h3 style="margin:0 0 4px">🗂 ${fmtD(arcD,true)}</h3><small style="color:var(--mut)">${esc(cls)} — شعبة ${esc(sec)} • ${d.list.length} طالب</small>`;
 if(!d.rec.length)return h+`<div class="empty" style="padding:18px 0">لا توجد دروس مسجّلة في هذا اليوم.</div></div>`+foot();
 h+=`<div class="arck"><div><b>${d.rec.length}<small style="font-size:13px;color:var(--mut)">/${d.L.length}</small></b><span>دروس مسجّلة</span></div><div><b>${d.teachers.length}</b><span>مدرسون حضروا</span></div><div class="r"><b>${d.tot.stu}</b><span>طلاب غائبون</span></div><div class="a"><b>${d.tot.full}</b><span>غياب يوم كامل</span></div></div>
 <h4 style="margin:6px 0 0;color:var(--g1)">الدروس والمدرسون</h4><div class="arcw"><table class="at"><thead><tr><th>الدرس</th><th>الوقت</th><th>المدرس</th><th>المادة</th><th>غائب</th><th>مجاز</th></tr></thead><tbody>
 ${d.L.map(q=>q.ses?`<tr><td>${ORD[q.n-1]||q.n}</td><td>${esc(q.t)}</td><td class="nm">${esc(q.ses.teacher)}</td><td>${esc(q.ses.subject)}</td><td class="${q.a?'ar':'az'}">${q.a}</td><td class="${q.e?'ae':'az'}">${q.e}</td></tr>`:`<tr><td>${ORD[q.n-1]||q.n}</td><td>${esc(q.t)}</td><td class="az" colspan="4">لم يُسجَّل</td></tr>`).join('')}</tbody></table></div>
 <h4 style="margin:6px 0 0;color:var(--g1)">غيابات الطلاب</h4><div class="arcl">🟥 غائب &nbsp; 🟨 مجاز &nbsp; ✓ حاضر &nbsp; — لم يُسجَّل الدرس</div>`;
 h+=d.rows.length?`<div class="arcw"><table class="at"><thead><tr><th>#</th><th class="nm">الطالب</th>${d.L.map(q=>`<th>${lessonName(q.n)}<small>${q.ses?esc(q.ses.teacher):'لم يُسجَّل'}</small></th>`).join('')}<th>غياب</th><th>مجاز</th><th>الحالة</th></tr></thead><tbody>
 ${d.rows.map((r,i)=>`<tr><td>${i+1}</td><td class="nm">${esc(r.s.name)}</td>${r.m.map(v=>{const c=arcCell(v);return `<td class="${c[1]}">${c[0]}</td>`}).join('')}<td class="${r.a?'ar':'az'}">${r.a}</td><td class="${r.e?'ae':'az'}">${r.e}</td><td class="${arcSc(r)}" style="white-space:nowrap">${arcSt(r)}</td></tr>`).join('')}</tbody></table></div>`
 :`<div class="empty" style="padding:14px 0">لا غياب في هذا اليوم — حضور كامل ✓</div>`;
 h+=`<div class="btns" style="margin-top:10px"><button class="btn gold" onclick="arcPrint(${J(cls)},${J(sec)},0)">🖨 طباعة</button><button class="btn blue" onclick="arcPrint(${J(cls)},${J(sec)},1)">📄 PDF</button><button class="btn" style="background:#1d6f42;color:#fff" onclick="arcXlsx(${J(cls)},${J(sec)})">📊 Excel</button></div></div>`;
 return h+foot()}

/* طباعة الأرشيف: تقسيم تلقائي إلى صفحات، كل صفحة بترويسة وعنوان قسم وترقيم */
function arcCap(){const p=document.createElement('div');p.style.cssText='position:absolute;left:-99999px;top:0;width:194mm;height:281mm';document.body.appendChild(p);const h=p.getBoundingClientRect().height;p.remove();return h}
function arcMeasure(fn){const m=document.createElement('div');m.style.cssText='position:absolute;left:-99999px;top:0;width:194mm;visibility:hidden';document.body.appendChild(m);try{return fn(m)}finally{m.remove()}}
function arcHTML(cls,sec,date){
 const d=arcData(cls,sec,date),n=d.rows.length,cap=arcCap()*0.96;
 const card=(body,k,N,minh)=>`<div class="tk rep arcpg"${minh?` style="min-height:${Math.floor(minh)}px"`:''}>${tkWm()}${tkHead('أرشيف غياب الشعبة','🗂')}<div class="tk-b">${body}</div><div class="tk-ft"><span>${SCHOOL}</span><span>صفحة ${k} من ${N}</span><span>تصميم: <b>${DESIGNER}</b></span></div></div>`;
 const sh=`<div class="tk-sh"><div><small>الصف</small><b>${esc(cls)}</b></div><div><small>الشعبة</small><b>${esc(sec)}</b></div><div><small>عدد الطلاب</small><b>${d.list.length}</b></div><div><small>التاريخ</small><b style="font-size:13px">${fmtD(date,true)}</b></div></div>`;
 const bar=`<div class="tk-mini"><span>${esc(cls)} — شعبة ${esc(sec)}</span><span>${fmtD(date,true)}</span><span>${d.list.length} طالب</span></div>`;
 const SIG=tkSig(['المرشد التربوي','معاون المدير','مدير المدرسة']);
 if(!d.rec.length)return card(sh+`<div class="tk-box">لا توجد دروس مسجّلة لهذه الشعبة في هذا اليوم.</div>`,1,1,cap);
 const pre=sh+tkK([[d.rec.length+'/'+d.L.length,'دروس مسجّلة','',1],[d.teachers.length,'مدرسون حضروا'],[d.tot.stu,'طلاب غائبون','r'],[d.tot.full,'غياب يوم كامل','a']])+
 `<h4>الدروس والمدرسون</h4><table class="tk-t big"><thead><tr><th>الدرس</th><th>الوقت</th><th>المدرس</th><th>المادة</th><th>غائب</th><th>مجاز</th></tr></thead><tbody>
 ${d.L.map(q=>q.ses?`<tr><td>${ORD[q.n-1]||q.n}</td><td>${esc(q.t)}</td><td style="text-align:right;font-weight:700">${esc(q.ses.teacher)}</td><td>${esc(q.ses.subject)}</td><td class="${q.a?'rd':''}">${q.a}</td><td class="${q.e?'am':''}">${q.e}</td></tr>`:`<tr><td>${ORD[q.n-1]||q.n}</td><td>${esc(q.t)}</td><td colspan="4" style="color:#889">لم يُسجَّل</td></tr>`).join('')}</tbody></table>`;
 if(!n)return card(pre+`<h4>غيابات الطلاب</h4><div class="tk-box">لا غياب في هذا اليوم — حضور كامل ✓</div>`+SIG,1,1,cap);
 const lg='<div class="tk-lg">🟥 غائب &nbsp; 🟨 مجاز &nbsp; ✓ حاضر &nbsp; — لم يُسجَّل الدرس</div>';
 const mHead=`<tr><th>#</th><th class="nmc">اسم الطالب</th>${d.L.map(q=>`<th>${lessonName(q.n)}<br><span style="font-weight:600;font-size:10px">${q.ses?esc(q.ses.teacher):'لم يُسجَّل'}</span></th>`).join('')}<th>غياب</th><th>مجاز</th><th>الحالة</th></tr>`;
 const mRow=i=>{const r=d.rows[i];return `<tr><td>${i+1}</td><td style="text-align:right;font-weight:700">${esc(r.s.name)}</td>${r.m.map(v=>`<td class="${v==='a'?'rd':v==='e'?'am':v==='p'?'gn':''}">${arcCell(v)[0]}</td>`).join('')}<td class="${r.a?'rd':''}">${r.a}</td><td class="${r.e?'am':''}">${r.e}</td><td class="st ${arcPc(r)}">${arcSt(r)}</td></tr>`};
 const mBlock=(ix,cont)=>`<h4>غيابات الطلاب${cont?' (تابع)':''}</h4>${lg}<table class="tk-t big"><thead>${mHead}</thead><tbody>${ix.map(mRow).join('')}</tbody></table>`;
 const H=el=>el.getBoundingClientRect().height,all=d.rows.map((_,i)=>i);
 const P1=arcMeasure(m=>{m.innerHTML=card(pre,1,1,0);return H(m.firstElementChild)});
 const T1=arcMeasure(m=>{m.innerHTML=card(pre+mBlock([],0),1,1,0);return H(m.firstElementChild)})-P1;
 const S=arcMeasure(m=>{m.innerHTML=card(bar+mBlock([],1),2,2,0);return H(m.firstElementChild)});
 const hs=arcMeasure(m=>{m.innerHTML=SIG;return H(m.firstElementChild)})+26;
 const rh=arcMeasure(m=>{m.innerHTML=card(bar+mBlock(all,1),2,2,0);return [...m.querySelectorAll('tbody tr')].map(H)});
 const pg=[{m:false,rows:[]}];let room=0;
 const two=rh.slice(0,Math.min(n,4)).reduce((a,b)=>a+b,0);
 if(cap-P1-T1>=two){pg[0].m=true;room=cap-P1-T1}else{pg.push({m:true,rows:[]});room=cap-S}
 let cur=pg[pg.length-1];
 all.forEach(i=>{if(rh[i]>room&&cur.rows.length){cur={m:true,rows:[]};pg.push(cur);room=cap-S}cur.rows.push(i);room-=rh[i]});
 if(room<hs){if(pg.length===1){const rs=pg[0].rows;pg[0]={m:false,rows:[]};pg.push({m:true,rows:rs})}else{const last=pg[pg.length-1],mv=last.rows.length>2?2:last.rows.length;pg.push({m:true,rows:last.rows.splice(last.rows.length-mv,mv)})}}
 const N=pg.length;let started=false;
 return pg.map((p,k)=>{
  let body=k===0?pre:bar;
  if(p.m&&p.rows.length){body+=mBlock(p.rows,started);started=true}
  if(k===N-1)body+=SIG;
  return card(body,k+1,N,cap)}).join('')}

function arcXlsx(cls,sec){
 if(typeof XLSX==='undefined'){toast('مكتبة Excel لم تُحمَّل — تحقق من الإنترنت');return}

function cropTo(src,w,h,size=280){const c=document.createElement('canvas');c.width=c.height=size;const s=Math.min(w,h);c.getContext('2d').drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,size,size);return c.toDataURL('image/jpeg',.72)}
function pickPhoto(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>cb(cropTo(im,im.width,im.height));im.src=URL.createObjectURL(f)};i.click()}
async function capturePhoto(cb){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('الكاميرا غير متاحة هنا — اخترنا لك رفع صورة');return pickPhoto(cb)}
 const w=document.createElement('div');w.className='camwrap';w.innerHTML='<video playsinline autoplay muted></video><div class="camtools"><button id="cx">إغلاق</button><button class="shutter" id="cs" aria-label="التقاط"></button><button id="cf">قلب الكاميرا</button></div>';
 document.body.appendChild(w);let stream,facing='user';const v=w.querySelector('video');
 const stop=()=>{stream&&stream.getTracks().forEach(t=>t.stop());w.remove()};
 const start=async()=>{stream&&stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:1280}},audio:false});v.srcObject=stream}catch(e){stop();toast('تعذّر فتح الكاميرا — تأكد من السماح بالوصول');}};
 $('#cx').onclick=stop;$('#cf').onclick=()=>{facing=facing==='user'?'environment':'user';start()};
 $('#cs').onclick=()=>{if(!v.videoWidth)return;const d=cropTo(v,v.videoWidth,v.videoHeight);stop();cb(d)};
 start();
}

function addCls(){const v=$('#nc').value.trim();if(!v)return;ensureStruct(v,'أ');save();render()}
function addSec(c){openModal(`<h3>شعبة جديدة في ${esc(c)}</h3><input id="nsec" placeholder="مثال: ج"><div class="btns" style="margin-top:12px"><button class="btn gold" onclick="const v=$('#nsec').value.trim();if(v){ensureStruct(${J(c)},v);save();closeModal();render()}">إضافة</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`)}
function delSec([c,s]){delSection(c,s)}
function delSection(c,s){askAdmin(()=>{
 const n=studentsOf(c,s).length,m=db.sessions.filter(x=>x.cls===c&&x.sec===s).length;
 confirmBox(`حذف شعبة <b>${esc(s)}</b> من <b>${esc(c)}</b> نهائياً؟<br>سيُحذف <b>${n}</b> طالب و<b>${m}</b> سجل حضور. (يمكن الاسترداد من الحالة التلقائية)`,()=>{
  snapshot();db.students=db.students.filter(x=>!(x.cls===c&&x.sec===s));db.sessions=db.sessions.filter(x=>!(x.cls===c&&x.sec===s));
  db.structure[c]=(db.structure[c]||[]).filter(x=>x!==s);save();toast('تم حذف الشعبة');
  if(view.n==='admin')render();else go('home')},'حذف')})}

/* ---------- EXCEL IMPORT ---------- */
function pickXlsx(){askAdmin(()=>{
 if(typeof XLSX==='undefined'){toast('مكتبة Excel لم تُحمَّل — تحقق من الإنترنت');return}
 const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';
 i.onchange=async()=>{try{const wb=XLSX.read(await i.files[0].arrayBuffer(),{type:'array'});parseSheets(wb)}catch(e){toast('تعذّر قراءة الملف')}};i.click()})}
function parseSheets(wb){
 let all=[],hasC=false,hasS=false;
 wb.SheetNames.forEach(n=>{
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});if(!rows.length)return;
  let hr=-1,map={};
  for(let r=0;r<Math.min(rows.length,12);r++){
   const m={};rows[r].forEach((c,ix)=>{const t=norm(c);if(!t)return;
    if(t.includes('هاتف')||t.includes('موبايل')||t.includes('جوال')||t.includes('واتس'))m.gp=ix;else if(t.includes('ولي'))m.gn=ix;else if(t.includes('صفحه'))m.page=ix;else if(t.includes('قيد'))m.reg=ix;else if(t.includes('شعبه'))m.sec=ix;else if(t.includes('صف')||t.includes('مرحله'))m.cls=ix;else if(t.includes('اسم')&&m.name===undefined)m.name=ix});
   if(m.name!==undefined){hr=r;map=m;break}
  }
  let start=hr+1;
  if(hr<0){ // no header: guess
   const cols=Math.max(...rows.slice(0,20).map(r=>r.length));let best=-1,bl=0;
   for(let c=0;c<cols;c++){const v=rows.slice(0,20).map(r=>String(r[c]??'')).filter(x=>/[\u0600-\u06FF]/.test(x));const a=v.reduce((s,x)=>s+x.length,0)/(v.length||1);if(v.length&&a>bl){bl=a;best=c}}
   if(best<0)return;map={name:best};const nums=[];for(let c=0;c<cols;c++)if(c!==best&&rows.slice(0,20).some(r=>/^\d+$/.test(String(r[c]).trim())))nums.push(c);
   if(nums[0]!==undefined)map.reg=nums[0];if(nums[1]!==undefined)map.page=nums[1];start=0;
  }
  if(map.cls!==undefined)hasC=true;if(map.sec!==undefined)hasS=true;
  for(let r=start;r<rows.length;r++){
   const g=k=>map[k]===undefined?'':String(rows[r][map[k]]??'').trim(),name=g('name');
   if(!name||/^\d+$/.test(name)||!/[\u0600-\u06FFA-Za-z]/.test(name))continue;
   all.push({name:name.replace(/\s+/g,' '),reg:g('reg'),page:g('page'),cls:g('cls'),sec:g('sec'),gname:g('gn'),gphone:g('gp')});
  }
 });
 if(!all.length){toast('لم يُعثر على أسماء في الملف');return}
 const need=all.some(x=>!x.cls||!x.sec);
 openModal(`<h3>معاينة الاستيراد</h3><p>تم العثور على <b style="color:var(--g1)">${all.length}</b> طالب.</p>
 ${need?`<div style="color:var(--amb);font-size:13px">بعض الصفوف لا تحتوي على الصف/الشعبة — اختر الوجهة لها:</div><div class="two"><div><label>الصف</label><input id="iC" list="dc2" placeholder="مثال: الرابع العلمي"></div><div><label>الشعبة</label><input id="iS" list="ds2" placeholder="مثال: أ"></div></div><datalist id="dc2">${Object.keys(db.structure).map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="ds2">${[...new Set(Object.values(db.structure).flat())].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`:''}
 <table class="t" style="margin-top:8px"><tr><th>الاسم</th><th>القيد</th><th>الصفحة</th></tr>${all.slice().sort(cmp).slice(0,5).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.reg)}</td><td>${esc(x.page)}</td></tr>`).join('')}</table><small style="color:var(--mut)">… ويُرتَّب الجميع أبجدياً. الأسماء المكررة تُحدَّث ولا تتكرر.</small>
 <div class="btns" style="margin-top:14px"><button class="btn gold" id="iok">استيراد</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);
 $('#iok').onclick=()=>{
  const tc=$('#iC')?.value.trim()||'',ts=$('#iS')?.value.trim()||'';
  if(need&&(!tc||!ts)&&all.some(x=>(!x.cls&&!tc)||(!x.sec&&!ts))){toast('حدّد الصف والشعبة');return}
  snapshot();let add=0,upd=0;
  all.forEach(x=>{const cls=x.cls||tc,sec=x.sec||ts;
   const d=db.students.find(s=>s.cls===cls&&s.sec===sec&&norm(s.name)===norm(x.name));
   if(d){if(x.reg)d.reg=x.reg;if(x.page)d.page=x.page;if(x.gname)d.gname=x.gname;if(x.gphone)d.gphone=x.gphone;upd++}else{db.students.push({id:uid(),name:x.name,reg:x.reg,page:x.page,cls,sec,photo:'',gname:x.gname||'',gphone:x.gphone||''});add++}
   ensureStruct(cls,sec)});
  db.students.sort(cmp);save();closeModal();toast(`تمت إضافة ${add} وتحديث ${upd}`);render();
 };
}

/* ---------- WHATSAPP (اختياري) ---------- */
const WA_AD='٠١٢٣٤٥٦٧٨٩',WA_PD='۰۱۲۳۴۵۶۷۸۹';
function waNum(p){
 let d=String(p||'').replace(/[٠-٩]/g,c=>WA_AD.indexOf(c)).replace(/[۰-۹]/g,c=>WA_PD.indexOf(c)).replace(/\D/g,'');
 if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='964'+d.slice(1);else if(d.length===10&&d[0]==='7')d='964'+d;
 return d.length>=11&&d.length<=15?d:''}
const WA_DEF={mode:'manual',api:'',onSave:false,
 greet:'السلام عليكم ورحمة الله وبركاته\nالسيد {ولي_الأمر} المحترم،\nنحيطكم علماً بخصوص الطالب: *{الطالب}* ({الصف} — شعبة {الشعبة})',
 foot:'يرجى المتابعة والتواصل مع إدارة المدرسة عند الحاجة.\n{المدرسة}',
 pr:'حاضر ✅',ab:'غائب ❌',ex:'مجاز 🟡',fullAb:'⚠️ غياب يوم كامل',fullEx:'🟡 إجازة ليوم كامل',fullPr:'✅ حضر طوال اليوم',tot:'📊 سجل الطالب حتى تاريخه:'};
const WA_TK=['greet','foot','pr','ab','ex','fullAb','fullEx','fullPr','tot'];
function waC(){const o=Object.assign({},WA_DEF,(db&&db.wa)||{});WA_TK.forEach(k=>{if(!String(o[k]||'').trim())o[k]=WA_DEF[k]});return o}
const waIsAuto=()=>{const c=waC();return c.mode==='auto'&&!!c.api};
const waFill=(t,s)=>String(t).split('{الطالب}').join(s.name||'').split('{الصف}').join(s.cls||'').split('{الشعبة}').join(s.sec||'').split('{ولي_الأمر}').join(s.gname||'ولي أمر الطالب').split('{المدرسة}').join(SCHOOL);
function statsDraft(s){const bk=db.sessions;db.sessions=bk.filter(x=>x.id!==draft.id).concat([draft]);try{return stats(s)}finally{db.sessions=bk}}

function waOpen(phone,text){
 const n=waNum(phone);if(!n){toast('رقم ولي الأمر غير مُدخل أو غير صالح');return false}
 const u='https://wa.me/'+n+'?text='+encodeURIComponent(text);
 const w=window.open(u,'_blank');
 if(!w){if(draft){toast('اسمح بالنوافذ المنبثقة لفتح واتساب');return false}location.href=u}
 return true}

/* إرسال تلقائي عبر خدمة وسيطة (Cloud Function) — لا يُخزَّن أي مفتاح سري في هذا الملف */
async function waAuto(phone,text){
 const n=waNum(phone);if(!n)return{ok:false,err:'رقم غير صالح'};
 const c=waC();if(!c.api)return{ok:false,err:'لم يُضبط رابط الخدمة'};
 try{
  const u=(typeof firebase!=='undefined'&&firebase.apps.length)?firebase.auth().currentUser:null,tok=u?await u.getIdToken():'';
  const r=await Promise.race([fetch(c.api,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({to:n,text})}),new Promise((_,j)=>setTimeout(()=>j(new Error('انتهت المهلة')),20000))]);
  const d=await r.json().catch(()=>({}));
  return r.ok&&d.ok!==false?{ok:true}:{ok:false,err:d.error||('HTTP '+r.status)};
 }catch(e){return{ok:false,err:String((e&&e.message)||e)}}}
async function waGo(ph,msg,auto,fb){
 if(!waNum(ph)){toast('رقم ولي الأمر غير مُدخل أو غير صالح');return false}
 if(auto){
  toast('جارٍ الإرسال…');const r=await waAuto(ph,msg);
  if(r.ok){toast('تم الإرسال تلقائياً ✓');return true}
  toast('تعذّر الإرسال التلقائي: '+r.err);
  if(!(fb&&!draft))return false}
 return waOpen(ph,msg)}

function waText(s,P){
 const c=waC(),L=[waFill(c.greet,s)],stt=m=>m==='a'?c.ab:m==='e'?c.ex:c.pr;
 if(P.cur){const q=P.cur;L.push('','📅 '+fmtD(q.date,true),`• ${lessonName(q.lesson)}${q.subject?' ('+q.subject+')':''}: ${stt(q.m)}`)}
 if(P.day){
  const d=P.day.date,ln=P.day.lesson,ses=db.sessions.filter(x=>x.cls===s.cls&&x.sec===s.sec&&x.date===d&&(!ln||x.lesson===ln)).sort((a,b)=>a.lesson-b.lesson);
  L.push('','📅 '+fmtD(d,true)+(ln?' — '+lessonName(ln):''));
  if(!ses.length)L.push('• لا توجد دروس مسجّلة في هذا التاريخ');
  else{
   ses.forEach(x=>{L.push(`• ${lessonName(x.lesson)}${x.subject?' ('+x.subject+')':''}: ${stt(x.marks[s.id])}`)});
   if(!ln){const a=ses.filter(x=>x.marks[s.id]==='a').length,e=ses.filter(x=>x.marks[s.id]==='e').length;
    if(a===ses.length)L.push(c.fullAb);else if(e===ses.length)L.push(c.fullEx);else if(!a&&!e)L.push(c.fullPr)}}}
 if(P.tot){
  const x=(P.cur&&draft)?statsDraft(s):stats(s),dd=new Set(x.log.filter(r=>r.st==='a').map(r=>r.date)).size;
  L.push('',c.tot,`• مجموع أيام الغياب: ${dd} يوم (منها ${x.fullAbs} يوم كامل)`,`• مجموع الدروس الغائبة: ${x.absL} درس`,`• الدروس المجازة: ${x.excL} درس`)}
 if(P.leave){
  const q=P.leave,n=q.fr&&q.to?Math.max(1,daysBetween(q.fr,q.to)):'',back=q.to?addDays(q.to,1):'';
  L.push('','🏖 '+(q.ty||'إجازة')+(q.nt?' — '+q.nt:''));
  if(q.fr)L.push(`• من ${fmtD(q.fr)}${q.to?' إلى '+fmtD(q.to):''}${n?' ('+n+' يوم)':''}`);
  if(back)L.push('• المباشرة بالدوام: '+fmtD(back))}
 if(P.note)L.push('','📝 '+P.note);
 L.push('',waFill(c.foot,s));
 return L.join('\n')}

/* --- إشعار بعد حفظ الحضور --- */
function waQueue(){
 const c=waC(),auto=waIsAuto()&&!!c.onSave;
 if(!auto&&localStorage.getItem('waAsk')==='0')return null;
 const sent=draft.wa||{};
 const items=Object.entries(draft.marks).filter(([i,m])=>(m==='a'||m==='e')&&waNum((db.students.find(x=>x.id===i)||{}).gphone)&&sent[i]!==m);
 return items.length?{id:draft.id,date:draft.date,lesson:draft.lesson,items,auto}:null}
let waQ=null;
function waMarkSent(sid,stuId){const x=db.sessions.find(z=>z.id===sid);if(x){x.wa=x.wa||{};x.wa[stuId]=x.marks[stuId]||'';save()}}
async function waAutoBatch(q){
 toast('جارٍ إرسال الإشعارات…');let ok=0;const bad=[],badItems=[];
 for(const it of q.items){
  const s=db.students.find(x=>x.id===it[0]);if(!s)continue;
  const r=await waAuto(s.gphone,waText(s,{day:{date:q.date,lesson:q.lesson},tot:1}));
  if(r.ok){ok++;waMarkSent(q.id,s.id)}else{bad.push(s.name+' — '+r.err);badItems.push(it)}}
 if(!bad.length){toast(`تم إرسال ${ok} رسالة ✓`);return}
 waQ=Object.assign({},q,{items:badItems,auto:false});

 if(waOpen(s.gphone,msg)){b.textContent='✓ فُتح';b.style.opacity='.6'}}

 <label class="chk"><input type="checkbox" ${c.onSave?'checked':''} onchange="waSet('onSave',this.checked)">إرسال تلقائي فور حفظ الحضور (للغائبين والمجازين فقط، بدون نافذة)</label>

 <div class="two">${f('pr','نص «حاضر»')}${f('ab','نص «غائب»')}</div>

/* ---------- CLOUD SYNC (Firebase Firestore) ---------- */
/* ضع إعدادات مشروعك هنا (Firebase Console ← Project settings ← Your apps ← Web app) */
const FIREBASE_CONFIG={apiKey:'AIzaSyB-SZwVTdZXpQiey9y7w2ODjjTZ9sokFs8',authDomain:'attendance-absence.firebaseapp.com',projectId:'attendance-absence',storageBucket:'attendance-absence.firebasestorage.app',messagingSenderId:'75618103709',appId:'1:75618103709:web:a8f7c9c17de00d730f7f74'};
const cloud={on:false,tried:false,st:{},se:{},cfg:'',legacy:null,mig:false,srv:{},got:{},pend:{},defer:{},pr:false,dirty:false,err:false};
let FS=null;
const stab=o=>{if(o===null||typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return'['+o.map(stab).join(',')+']';return'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stab(o[k])).join(',')+'}'};
const stuO=s=>({name:s.name||'',reg:s.reg||'',page:s.page||'',cls:s.cls||'',sec:s.sec||'',photo:s.photo||'',gname:s.gname||'',gphone:s.gphone||''});
const sameStu=(a,b)=>!!a&&a.name===b.name&&a.reg===b.reg&&a.page===b.page&&a.cls===b.cls&&a.sec===b.sec&&a.photo===b.photo&&a.gname===b.gname&&a.gphone===b.gphone;
const cfgObj=()=>({structure:Object.entries(db.structure).map(([c,s])=>({c,s})),lessons:db.lessons,behaviors:db.behaviors,code:db.code,wa:db.wa||null,v:db.v||1});
/* الجلسات تُخزَّن في مستند لكل (صف+شعبة+شهر) لتقليل عدد القراءات */
const sparts=id=>{const p=id.split('|'),m=p[0].slice(0,7);return{doc:(p[1]+'|'+p[2]+'|'+m).replace(/\//g,'_'),key:p[0]+'_'+p[3],cls:p[1],sec:p[2],month:m}};

function cbadge(){const e=$('#syncb');if(!e)return;let k='',t;
 if(!cloud.on){t='💾 محلي'}
 else if(cloud.err){k='e';t='⚠️ خطأ مزامنة'}
 else if(!navigator.onLine){k='w';t='📴 غير متصل — يُحفظ محلياً'}
 else if(cloud.pend.st||cloud.pend.se||cloud.pend.cfg){k='w';t='⏳ جارٍ المزامنة'}
 else{k='ok';t='☁️ متزامن'}
 e.className=k;e.textContent=t}
function whenClean(k,fn){if(cloud.dirty)cloud.defer[k]=fn;else fn()}
function flushDefer(){const d=cloud.defer;cloud.defer={};Object.values(d).forEach(f=>f())}
function softRender(){
 if(!db)return;
 const a=document.activeElement,busy=view.n==='att'||$('#modal').classList.contains('show')||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
 if(busy){cloud.pr=true;return}
 render()}
setInterval(()=>{if(cloud.pr){cloud.pr=false;softRender()}},1500);

function cloudErr(e){console.error(e);cloud.err=true;cbadge();toast(e&&e.code==='permission-denied'?'لا توجد صلاحية — راجع قواعد Firestore وتفعيل Anonymous':'تعذّرت المزامنة')}

function cloudSave(){
 if(!cloud.on)return;
 const FP=firebase.firestore.FieldPath,FV=firebase.firestore.FieldValue,ops=[];
 const ids=new Set();
 db.students.forEach(s=>{ids.add(s.id);const o=stuO(s);if(!sameStu(cloud.st[s.id],o))ops.push(b=>b.set(FS.collection('students').doc(s.id),o))});
 Object.keys(cloud.st).forEach(id=>{if(!ids.has(id))ops.push(b=>b.delete(FS.collection('students').doc(id)))});
 const up={},sids=new Set(),U=p=>up[p.doc]=up[p.doc]||{p,sets:{},dels:[]};
 db.sessions.forEach(x=>{sids.add(x.id);if(cloud.se[x.id]!==stab(x)){const p=sparts(x.id);U(p).sets[p.key]=x}});
 Object.keys(cloud.se).forEach(id=>{if(!sids.has(id)){const p=sparts(id);U(p).dels.push(p.key)}});
 Object.entries(up).forEach(([did,u])=>{
  const ref=FS.collection('sessions').doc(did),keys=Object.keys(u.sets);
  if(keys.length)ops.push(b=>b.set(ref,{cls:u.p.cls,sec:u.p.sec,month:u.p.month,lessons:u.sets},{mergeFields:['cls','sec','month',...keys.map(k=>new FP('lessons',k))]}));
  if(u.dels.length)ops.push(b=>{const a=[];u.dels.forEach(k=>a.push(new FP('lessons',k),FV.delete()));b.update(ref,...a)});
 });
 const c=cfgObj();if(stab(c)!==cloud.cfg)ops.push(b=>b.set(FS.collection('meta').doc('config'),c));
 for(let i=0;i<ops.length;i+=200){const b=FS.batch();ops.slice(i,i+200).forEach(f=>f(b));b.commit().catch(cloudErr)}
}

async function nextNum(){
 if(cloud.on){
  try{
   const ref=FS.collection('meta').doc('counter');
   const n=await Promise.race([FS.runTransaction(async t=>{const d=await t.get(ref);const n=((d.exists&&d.data().n)||0)+1;t.set(ref,{n});return n}),new Promise((_,r)=>setTimeout(r,5000))]);
   db.counter=n;return n
  }catch(e){}
 }
 db.counter=(db.counter||0)+1;save();
 if(cloud.on)FS.collection('meta').doc('counter').set({n:db.counter}).catch(()=>{});
 return db.counter}

function migrate(){
 const L=cloud.legacy;
 if(L){db=Object.assign(defDB(),L);if(L.students&&L.students.length)toast('جارٍ رفع بيانات هذا الجهاز إلى السحابة…')}
 FS.collection('meta').doc('counter').set({n:db.counter||0}).catch(()=>{});
 save();softRender()}

function startListeners(){
 const col=(name,key,ap)=>FS.collection(name).onSnapshot({includeMetadataChanges:true},sn=>{
  cloud.err=false;cloud.pend[key]=sn.metadata.hasPendingWrites;
  if(!sn.metadata.fromCache)cloud.srv[key]=1;
  cbadge();
  if(sn.empty&&sn.metadata.fromCache&&!cloud.srv[key])return;
  if(cloud.got[key]&&!sn.docChanges().length)return;
  cloud.got[key]=1;
  whenClean(key,()=>ap(sn));
 },cloudErr);
 col('students','st',sn=>{
  cloud.st={};
  db.students=sn.docs.map(d=>{const o=stuO(d.data());cloud.st[d.id]=o;return Object.assign({id:d.id},o)});
  softRender()});
 col('sessions','se',sn=>{
  cloud.se={};const out=[];
  sn.docs.forEach(d=>{Object.values(d.data().lessons||{}).forEach(x=>{if(x&&x.id){out.push(x);cloud.se[x.id]=stab(x)}})});
  db.sessions=out;softRender()});
 FS.collection('meta').doc('config').onSnapshot({includeMetadataChanges:true},d=>{
  cloud.err=false;cloud.pend.cfg=d.metadata.hasPendingWrites;cbadge();
  if(!d.exists){if(!d.metadata.fromCache&&!cloud.mig){cloud.mig=true;migrate()}return}
  const c=d.data(),j=stab({structure:c.structure,lessons:c.lessons,behaviors:c.behaviors,code:c.code,wa:c.wa||null,v:c.v||1});
  if(j===cloud.cfg)return;
  whenClean('cfg',()=>{
   if(Array.isArray(c.structure)){db.structure={};c.structure.forEach(x=>{db.structure[x.c]=x.s||[]})}
   ['lessons','behaviors','code','wa'].forEach(k=>{if(c[k]!==undefined)db[k]=c[k]});
   cloud.cfg=j;softRender()});
 },cloudErr);
 FS.collection('meta').doc('counter').onSnapshot(d=>{if(d.exists&&db)db.counter=Math.max(db.counter||0,d.data().n||0)},()=>{});
}

async function cloudInit(){
 cloud.tried=true;cloud.err=false;
 if(!FIREBASE_CONFIG.apiKey||typeof firebase==='undefined'||!firebase.firestore){cbadge();return}
 if(location.protocol==='file:'){cbadge();toast('المزامنة تحتاج فتح الموقع من رابط https وليس كملف على الجهاز');return}
 try{
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  if(!FS){FS=firebase.firestore();FS.settings({ignoreUndefinedProperties:true});try{await FS.enablePersistence({synchronizeTabs:true})}catch(e){}}
  const au=firebase.auth();
  const u=await new Promise(r=>{const un=au.onAuthStateChanged(x=>{un();r(x)})});
  if(!u)await au.signInAnonymously();
 }catch(e){console.error(e);cloud.err=true;cbadge();toast('تعذّر الاتصال بـ Firebase — تحقق من الإعدادات أو الإنترنت');return}
 cloud.on=true;startListeners();cbadge()}
addEventListener('online',()=>{cbadge();if(!cloud.on&&cloud.tried&&FIREBASE_CONFIG.apiKey)cloudInit()});
addEventListener('offline',cbadge);

/* ---------- INIT ---------- */
(async()=>{
 const d=await idbGet('db');
 db=d?Object.assign(defDB(),d):defDB();if(!d)idbPut('db',db);
 if(d&&FIREBASE_CONFIG.apiKey){cloud.legacy=JSON.parse(JSON.stringify(d));if(!(await idbGet('legacy_backup')))idbPut('legacy_backup',d)}
 history.replaceState({n:'home',p:{}},'');render();cbadge();
 cloudInit();
})();
</script>
